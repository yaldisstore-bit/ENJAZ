name: ENJAZ Phase 10.1 — Patch Real Cloud Archive Parser Once

on:
  push:
    branches: [phase10-1-document-vault]
    paths:
      - .github/workflows/phase10-1-fix-real-cloud-script-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: phase10-1-document-vault
      - name: Patch canonical RPC response key
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/phase10-1-real-cloud-e2e.mjs')
          s=p.read_text()
          old="const normalItems = Array.isArray(normalList?.items) ? normalList.items : [];\n  const archivedItems = Array.isArray(archiveList?.items) ? archiveList.items : [];"
          new="const normalItems = Array.isArray(normalList?.documents) ? normalList.documents : [];\n  const archivedItems = Array.isArray(archiveList?.documents) ? archiveList.documents : [];"
          if old not in s:
              raise SystemExit('expected archive parser block not found')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
          grep -F "normalList?.documents" scripts/phase10-1-real-cloud-e2e.mjs
          grep -F "archiveList?.documents" scripts/phase10-1-real-cloud-e2e.mjs
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ENJAZ Phase Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/phase10-1-real-cloud-e2e.mjs
          git commit -m 'Phase 10.1 — align real-cloud archive parser with RPC contract'
          git push origin HEAD:phase10-1-document-vault
