name: ENJAZ Phase 7.1 — Financial Ledger & Summary Gate

on:
  push:
    branches:
      - 'phase7-1-*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enjaz-phase71-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase7-1-finance:
    name: Finance Truth / Regression / Real Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Preserve canonical R2 and Legacy-Zero
        run: |
          node scripts/ui-rebirth-2-freeze-audit.mjs
          node scripts/ui-rebirth-2-legacy-eradication-audit.mjs
      - name: Preserve closed Phase 6.4
        run: |
          npm run audit:phase6-4:companies-people-destruction
          npm run test:phase6-4
      - name: Enforce Phase 7.1 financial truth contract
        run: npm run audit:phase7-1:finance
      - name: Phase 7.1 model and service tests
        run: npm run test:phase7-1
      - name: Full functional regression
        run: npm run test:functional
      - name: Secrets audit
        run: npm run audit:secrets
      - name: Database integrity
        run: npm run db:audit && npm run db:audit:selftest
      - name: Roadmap integrity
        run: npm run audit:roadmap
      - name: TypeScript
        run: npm run typecheck
      - name: Production candidate build
        run: npm run build -- --base=/
      - name: Preserve production asset budget
        run: npm run audit:dist:budget
      - name: Build isolated Phase 7.1 finance preview
        run: npx vite build --config vite.phase7-1-preview.config.ts --base=/
      - name: Enforce isolated preview size
        run: |
          test -f dist-phase7-1-preview/phase7-1-preview.html
          BYTES=$(du -sb dist-phase7-1-preview | cut -f1)
          echo "Phase 7.1 preview bytes: $BYTES"
          test "$BYTES" -le 8388608
      - name: Install pinned real-browser tooling
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0 playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start isolated Phase 7.1 preview
        run: |
          nohup npx vite preview --config vite.phase7-1-preview.config.ts --host 127.0.0.1 --port 4181 > /tmp/enjaz-phase71-preview.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4181/phase7-1-preview.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/enjaz-phase71-preview.log
          exit 1
      - name: Real Chromium finance acceptance
        env:
          PHASE71_BASE_URL: http://127.0.0.1:4181/
          PHASE71_ARTIFACT_DIR: artifacts/phase7-1-finance
        run: npx playwright test tests-external/phase7-1-finance.spec.cjs --reporter=line --workers=1
      - name: Upload Phase 7.1 diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: enjaz-phase7-1-diagnostics-${{ github.sha }}
          path: |
            test-results/
            artifacts/phase7-1-finance/
            /tmp/enjaz-phase71-preview.log
          if-no-files-found: ignore
          retention-days: 7
