name: ENJAZ Phase 10.1 — One-Time Certifier Parser Repair

on:
  push:
    branches: [phase10-1-document-vault]
    paths:
      - .github/workflows/phase10-1-fix-certifier-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Repair real-cloud parser and remove one-time workflows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/phase10-1-real-cloud-e2e.mjs')
          s = p.read_text()
          old1 = "const normalItems = Array.isArray(normalList?.items) ? normalList.items : [];"
          old2 = "const archivedItems = Array.isArray(archiveList?.items) ? archiveList.items : [];"
          new1 = "const normalItems = Array.isArray(normalList?.documents) ? normalList.documents : [];"
          new2 = "const archivedItems = Array.isArray(archiveList?.documents) ? archiveList.documents : [];"
          if old1 not in s or old2 not in s:
              raise SystemExit('expected parser lines not found')
          p.write_text(s.replace(old1, new1).replace(old2, new2))
          PY
          git rm .github/workflows/phase10-1-oidc-certify-once.yml
          git rm .github/workflows/phase10-1-fix-certifier-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/phase10-1-real-cloud-e2e.mjs
          git diff --cached --check
          git commit -m 'Phase 10.1 — repair real-cloud archive parser and remove one-time OIDC'
          git push origin HEAD:phase10-1-document-vault
