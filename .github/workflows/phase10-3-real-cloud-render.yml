# Phase 10.3 production-certificate workflow: runs on every Phase 10.3 branch push.
name: ENJAZ Phase 10.3 — Real Cloud Arabic PDF Certificate

on:
  push:
    branches:
      - 'phase10-3-*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase10-3-real-cloud-render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-cloud-arabic-pdf:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SUPABASE_URL: https://juzxriirhkuzviwnhkbd.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_QL0eBUXHR6cSAVbINSkyWA_pIGyQ1oJ
      SUPABASE_SECRET_KEY: ${{ secrets.ENJAZ_SUPABASE_SECRET_KEY }}
      ENJAZ_REAL_CLOUD_CONFIRM: YES
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: One-shot resource hardening patch
        if: github.event_name == 'push' && github.ref_name == 'phase10-3-render-resource-hardening' && github.actor != 'github-actions[bot]'
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('supabase/functions/enjaz-document-render/index.ts')
          source=path.read_text()
          old="function wrapParagraph(value:string,font:Parameters<typeof measureArabicText>[1],size:number,maxWidth:number){const source=value.replace(/\\s+/g,' ').trim();if(!source)return [''];const words=source.split(' '),lines:string[]=[];let line='';for(const word of words){const candidate=line?`${line} ${word}`:word;if(measureArabicText(candidate,font,size)<=maxWidth){line=candidate;continue}if(line)lines.push(line);if(measureArabicText(word,font,size)<=maxWidth){line=word;continue}let chunk='';for(const char of [...word]){const next=chunk+char;if(chunk&&measureArabicText(next,font,size)>maxWidth){lines.push(chunk);chunk=char}else chunk=next}line=chunk}if(line)lines.push(line);return lines.length?lines:['']}"
          new="function wrapParagraph(value:string,font:Parameters<typeof measureArabicText>[1],size:number,maxWidth:number){const source=value.replace(/\\s+/g,' ').trim();if(!source)return [''];const words=source.split(' '),lines:string[]=[],widths=new Map<string,number>();const measure=(part:string)=>{const cached=widths.get(part);if(cached!==undefined)return cached;const width=measureArabicText(part,font,size);widths.set(part,width);return width},spaceWidth=measure(' ');let line='',lineWidth=0;for(const word of words){const wordWidth=measure(word);if(!line&&wordWidth<=maxWidth){line=word;lineWidth=wordWidth;continue}if(line&&lineWidth+spaceWidth+wordWidth<=maxWidth){line+=` ${word}`;lineWidth+=spaceWidth+wordWidth;continue}if(line)lines.push(line);if(wordWidth<=maxWidth){line=word;lineWidth=wordWidth;continue}let chunk='';for(const char of [...word]){const next=chunk+char;if(chunk&&measureArabicText(next,font,size)>maxWidth){lines.push(chunk);chunk=char}else chunk=next}line=chunk;lineWidth=chunk?measure(chunk):0}if(line)lines.push(line);return lines.length?lines:['']}"
          count=source.count(old)
          if count!=1: raise SystemExit(f'wrapParagraph replacement expected 1 match, found {count}')
          path.write_text(source.replace(old,new,1))
          test=Path('tests/documentRenderResourceGuard.test.ts')
          test.write_text("""import test from 'node:test';\nimport assert from 'node:assert/strict';\nimport fs from 'node:fs';\n\nconst source=fs.readFileSync('supabase/functions/enjaz-document-render/index.ts','utf8');\n\ntest('document renderer keeps paragraph measurement linear for normal word wrapping',()=>{\n  assert.ok(!source.includes('measureArabicText(candidate,font,size)'));\n  assert.match(source,/widths=new Map<string,number>\\(\\)/);\n  assert.match(source,/const wordWidth=measure\\(word\\)/);\n  assert.match(source,/lineWidth\\+spaceWidth\\+wordWidth<=maxWidth/);\n  assert.match(source,/lineWidth\\+=spaceWidth\\+wordWidth/);\n});\n\ntest('oversized single tokens retain exact measured splitting',()=>{\n  assert.match(source,/measureArabicText\\(next,font,size\\)>maxWidth/);\n  assert.match(source,/lineWidth=chunk\\?measure\\(chunk\\):0/);\n});\n""")
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/functions/enjaz-document-render/index.ts tests/documentRenderResourceGuard.test.ts
          git commit -m 'fix: reduce document renderer text-layout CPU pressure'
          git push origin HEAD:phase10-3-render-resource-hardening
      - name: Require privileged server-only test credential
        shell: bash
        run: |
          test -n "$SUPABASE_SECRET_KEY" || { echo 'ENJAZ_SUPABASE_SECRET_KEY is missing'; exit 1; }
          case "$SUPABASE_SECRET_KEY" in sb_publishable_*) echo 'Secret is not privileged'; exit 1;; esac
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Preserve Phase 10.3 authority before cloud mutation
        run: |
          node scripts/phase10-3-document-factory-audit.mjs
          node --experimental-strip-types --test tests/documentFactory.test.ts
          node --experimental-strip-types --test tests/documentFactoryExpansion.test.ts
          node --experimental-strip-types --test tests/documentFactoryFinalizationGuard.test.ts
          node --experimental-strip-types --test tests/documentRenderResourceGuard.test.ts
      - name: Authenticated real advanced Arabic PDF / QR / submission pack / Vault / zero-residue certificate
        run: node scripts/phase10-3-real-cloud-render-certificate.mjs
      - name: Upload Phase 10.3 Real Cloud render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase10-3-real-cloud-render-${{ github.sha }}
          path: artifacts/phase10-3-real-cloud-render/evidence.json
          if-no-files-found: error
          retention-days: 30
