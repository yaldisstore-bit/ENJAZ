# Phase 10.3 production-certificate workflow: runs on every Phase 10.3 branch push.
name: ENJAZ Phase 10.3 — Real Cloud Arabic PDF Certificate

on:
  push:
    branches:
      - 'phase10-3-*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase10-3-real-cloud-render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-cloud-arabic-pdf:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SUPABASE_URL: https://juzxriirhkuzviwnhkbd.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_QL0eBUXHR6cSAVbINSkyWA_pIGyQ1oJ
      SUPABASE_SECRET_KEY: ${{ secrets.ENJAZ_SUPABASE_SECRET_KEY }}
      ENJAZ_REAL_CLOUD_CONFIRM: YES
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Require privileged server-only test credential
        shell: bash
        run: |
          test -n "$SUPABASE_SECRET_KEY" || { echo 'ENJAZ_SUPABASE_SECRET_KEY is missing'; exit 1; }
          case "$SUPABASE_SECRET_KEY" in sb_publishable_*) echo 'Secret is not privileged'; exit 1;; esac
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Preserve Phase 10.3 authority before cloud mutation
        run: |
          node scripts/phase10-3-document-factory-audit.mjs
          node --experimental-strip-types --test tests/documentFactory.test.ts
          node --experimental-strip-types --test tests/documentFactoryFinalizationGuard.test.ts
      - name: Authenticated real Arabic PDF / Vault / render-proof / finalization / zero-residue certificate
        run: node scripts/phase10-3-real-cloud-render-e2e.mjs
      - name: Upload Phase 10.3 Real Cloud render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase10-3-real-cloud-render-${{ github.sha }}
          path: artifacts/phase10-3-real-cloud-render/evidence.json
          if-no-files-found: error
          retention-days: 30
