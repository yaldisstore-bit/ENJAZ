name: ENJAZ Phase 9.6 — Process Mining & Predictive Operations Gate

on:
  push:
    branches:
      - main
      - 'phase9-6-*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enjaz-phase96-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase9-6-process-mining:
    name: Source-owned event lineage / partial ordering / rework / bottlenecks / empirical prediction / M18 lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - name: Preserve Phase 9.5 closure and audit Phase 9.6 foundation
        run: |
          node scripts/phase9-5-business-intelligence-audit.mjs
          node scripts/phase9-6-process-mining-audit.mjs
      - name: Process mining foundation destruction tests
        run: node --experimental-strip-types --test tests/phase9-6-process-mining-foundation.test.ts
      - name: Full functional regression
        run: npm run test:functional
      - name: Database and roadmap integrity
        run: npm run db:audit && npm run db:audit:selftest && npm run audit:roadmap
      - name: Major systems Zero-Escape governance
        run: node scripts/major-systems-zero-escape-audit.mjs
      - name: Secrets and TypeScript
        run: npm run audit:secrets && npm run typecheck
      - name: Production build and governed budgets
        run: npm run build -- --base=/ && npm run audit:dist:budget
      - name: Real Pages /live build and governed budgets
        run: npm run build -- --base=/ENJAZ/live/ && npm run audit:dist:budget
      - name: Assert Phase 9.6 governed lifecycle
        run: >-
          node -e "const j=JSON.parse(require('fs').readFileSync('docs/PHASE9_6_STATE.json','utf8'));
          const a=j.authority||{},m=j.majorSystem||{},p=j.predictionFoundation||{},t=j.projectQualityConstitution?.tracks||{};
          const ok=j.phase==='9.6'&&j.status==='IN_PROGRESS'&&j.baseCommit==='295ad9dd308e391e7d92b1e27de74c859b0a20b1'&&j.javascriptBudgetBytes===670000&&j.budgetIncreaseAllowed===false&&m.id==='M18'&&m.status==='ACTIVE'&&m.globalClosureAllowed===false&&Array.isArray(m.anchors)&&m.anchors.join(',')==='9,15'&&a.persistence==='SOURCE_DOMAIN_HISTORY_ONLY'&&a.processIntelligenceAuthority==='READ_ONLY_DERIVED'&&a.sourceProvenance==='REQUIRED'&&a.shadowProcessEventStoreAllowed===false&&a.fabricatedEventTimestampAllowed===false&&a.fabricatedStrictSequenceAllowed===false&&a.crossWorkspaceCompositionAllowed===false&&a.predictionAuthority==='DIRECTIONAL_NON_AUTHORITATIVE'&&p.method==='empirical_next_activity_frequency'&&p.minimumDirectionalCases===4&&p.tieBehavior==='NO_SINGLE_WINNER'&&p.authoritative===false&&j.exitGatePassed===false&&j.phase9_7Allowed===false&&j.nextPhase===null&&j.successorStatus==='LOCKED'&&t.product==='IN_PROGRESS'&&t.uiUx==='NOT_STARTED'&&t.engineering==='IN_PROGRESS'&&t.certification==='NOT_STARTED';
          if(!ok)process.exit(1)"
