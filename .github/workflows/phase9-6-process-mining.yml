name: ENJAZ Phase 9.6 — Process Mining & Predictive Operations Gate

on:
  push:
    branches:
      - main
      - 'phase9-6-*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enjaz-phase96-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase9-6-process-mining:
    name: Source-owned lineage / compact runtime parity / process intelligence / M18 lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - name: Preserve Phase 9.5 closure and audit Phase 9.6
        run: |
          node scripts/phase9-5-business-intelligence-audit.mjs
          node scripts/phase9-6-process-mining-audit.mjs
      - name: Process mining foundation destruction tests
        run: node --experimental-strip-types --test tests/phase9-6-process-mining-foundation.test.ts
      - name: Process source composition destruction tests
        run: node --experimental-strip-types --test tests/phase9-6-process-mining-service.test.ts
      - name: Compact browser runtime parity
        run: node --experimental-strip-types --test tests/phase9-6-process-mining-runtime-parity.test.ts
      - name: Process intelligence UI destruction tests
        run: node --experimental-strip-types --test tests/phase9-6-process-mining-ui.test.ts
      - name: Full functional regression
        run: npm run test:functional
      - name: Database and roadmap integrity
        run: npm run db:audit && npm run db:audit:selftest && npm run audit:roadmap
      - name: Major systems Zero-Escape governance
        run: node scripts/major-systems-zero-escape-audit.mjs
      - name: Secrets and TypeScript
        run: npm run audit:secrets && npm run typecheck
      - name: Production build and governed budgets
        run: npm run build -- --base=/ && npm run audit:dist:budget
      - name: Real Pages /live build and governed budgets
        run: npm run build -- --base=/ENJAZ/live/ && npm run audit:dist:budget
      - name: Assert Phase 9.6 governed lifecycle
        run: >-
          node -e "const j=JSON.parse(require('fs').readFileSync('docs/PHASE9_6_STATE.json','utf8'));
          const a=j.authority||{},m=j.majorSystem||{},p=j.predictionFoundation||{},t=j.projectQualityConstitution?.tracks||{},s=j.authoritativeSources?.fieldOperations||{},f=j.foundation||{},c=j.sourceComposition||{},u=j.runtime||{},r=j.realCloud||{},z=r.postProbeResidue||{};
          const cloud=r.status==='REAL_CLOUD_CERTIFIED'&&r.verification==='PASS_ZERO_RESIDUE'&&r.projectRef==='juzxriirhkuzviwnhkbd'&&r.migration==='database/migrations/phase_9_6_live_authenticated_process_probe.sql'&&r.appliedMigrationVersion==='20260912105428'&&r.authenticatedOwnerHistoryRead==='PASS'&&r.workflowHistoryRead==='PASS'&&r.fieldHistoryRead==='PASS'&&r.outsiderRlsIsolation==='PASS'&&r.syncReceiptActorScope==='PASS'&&r.directBrowserSourceMutationDenied==='PASS'&&r.anonSourceReadDenied==='PASS'&&r.shadowProcessPersistenceDetected===false&&r.phaseOwnedSecurityAdvisorFindings===0&&r.phaseOwnedPerformanceAdvisorFindings===0&&Object.values(z).every(v=>v===0);
          const foundation=f.status==='LOCAL_GATE_PASS'&&f.destructionTestCount===20&&f.gateConclusion==='SUCCESS';
          const source=c.status==='LOCAL_GATE_PASS'&&c.destructionTestCount===12&&c.gateConclusion==='SUCCESS'&&c.syncReceiptPolicy==='ACTOR_SCOPED_INTEGRITY_ONLY_NOT_PATH_INPUT';
          const runtime=['IN_PROGRESS_PENDING_GATE','LOCAL_GATE_PASS'].includes(u.status)&&u.canonicalDestination==='insights'&&u.defaultView==='business'&&u.processView==='process'&&u.route==='/app/insights?view=process'&&u.viewQuery==='view=process'&&u.runtimeContext==='src/features/process-intelligence/ProcessMiningHistoryContext.tsx'&&u.runtimeProjection==='src/features/process-intelligence/processMiningRuntime.ts'&&u.uiDestructionTestCount===12&&u.parityTestCount===3&&u.sameSupabaseClient===true&&u.sameDataFactory===true&&u.lazyRuntimeProjection===true&&u.referenceContractShippedToBrowser===false&&u.referenceServiceShippedToBrowser===false&&u.referenceSourceGatewayShippedToBrowser===false&&u.newDestinationAllowed===false&&u.newCssAdded===false&&u.realBrowser==='PENDING'&&u.publishedLive==='PENDING';
          const ok=j.phase==='9.6'&&j.status==='IN_PROGRESS'&&j.baseCommit==='295ad9dd308e391e7d92b1e27de74c859b0a20b1'&&j.javascriptBudgetBytes===670000&&j.budgetIncreaseAllowed===false&&m.id==='M18'&&m.status==='ACTIVE'&&m.globalClosureAllowed===false&&Array.isArray(m.anchors)&&m.anchors.join(',')==='9,15'&&a.persistence==='SOURCE_DOMAIN_HISTORY_ONLY'&&a.processIntelligenceAuthority==='READ_ONLY_DERIVED'&&a.sourceProvenance==='REQUIRED'&&a.shadowProcessEventStoreAllowed===false&&a.fabricatedEventTimestampAllowed===false&&a.fabricatedStrictSequenceAllowed===false&&a.crossWorkspaceCompositionAllowed===false&&a.predictionAuthority==='DIRECTIONAL_NON_AUTHORITATIVE'&&p.method==='empirical_next_activity_frequency'&&p.delayMethod==='empirical_wait_threshold_frequency'&&p.minimumDirectionalCases===4&&p.delayThresholdRequired===true&&p.delayEligibleEvidence==='STRICT_POSITIVE_WAIT_ONLY'&&p.tieBehavior==='NO_SINGLE_WINNER'&&p.authoritative===false&&Array.isArray(s.pathTables)&&s.pathTables.join(',')==='field_assignments,field_visits,field_visit_evidence'&&Array.isArray(s.integrityOnlyTables)&&s.integrityOnlyTables.join(',')==='field_sync_receipts'&&s.syncReceiptReadScope==='ACTOR_SCOPED'&&s.syncReceiptPathInputAllowed===false&&foundation&&source&&runtime&&cloud&&j.exitGatePassed===false&&j.phase9_7Allowed===false&&j.nextPhase===null&&j.successorStatus==='LOCKED'&&t.product==='IN_PROGRESS'&&t.uiUx==='IN_PROGRESS'&&t.engineering==='IN_PROGRESS'&&t.certification==='IN_PROGRESS';
          if(!ok)process.exit(1)"
