name: ENJAZ Phase 9.6 — Process Mining & Predictive Operations Gate

on:
  push:
    branches:
      - main
      - 'phase9-6-*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enjaz-phase96-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase9-6-process-mining:
    name: Source-owned lineage / compact runtime parity / process intelligence / M18 lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      VITE_APP_ENV: production
      VITE_APP_LOG_LEVEL: info
      VITE_SUPABASE_URL: https://juzxriirhkuzviwnhkbd.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_QL0eBUXHR6cSAVbINSkyWA_pIGyQ1oJ
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - name: Preserve Phase 9.5 closure and audit Phase 9.6
        run: |
          node scripts/phase9-5-business-intelligence-audit.mjs
          node scripts/phase9-6-process-mining-audit.mjs
      - name: Process mining foundation destruction tests
        run: |
          if [ "$(node -p "require('./docs/PHASE9_6_STATE.json').status")" = "CLOSED" ]; then
            node --experimental-strip-types --test tests/phase9-6-process-mining-closure-foundation.test.ts
          else
            node --experimental-strip-types --test tests/phase9-6-process-mining-foundation.test.ts
          fi
      - name: Process source composition destruction tests
        run: node --experimental-strip-types --test tests/phase9-6-process-mining-service.test.ts
      - name: Compact browser runtime parity
        run: node --experimental-strip-types --test tests/phase9-6-process-mining-runtime-parity.test.ts
      - name: Process intelligence UI destruction tests
        run: node --experimental-strip-types --test tests/phase9-6-process-mining-ui.test.ts
      - name: Full functional regression
        run: npm run test:functional
      - name: Database and roadmap integrity
        run: npm run db:audit && npm run db:audit:selftest && npm run audit:roadmap
      - name: Major systems Zero-Escape governance
        run: node scripts/major-systems-zero-escape-audit.mjs
      - name: Secrets and TypeScript
        run: npm run audit:secrets && npm run typecheck
      - name: Production build and governed budgets
        run: npm run build -- --base=/ && npm run audit:dist:budget
      - name: Real Pages /live build and governed budgets
        run: npm run build -- --base=/ENJAZ/live/ && npm run audit:dist:budget
