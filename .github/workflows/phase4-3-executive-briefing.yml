name: ENJAZ Phase 4.3 — Executive Briefing Reality Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase4-3-executive-briefing-reality-gate:
    name: Executive Briefing cumulative preservation after Legacy-Zero
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Preserve R2.0-10 Legacy-Zero contract
        run: node scripts/ui-rebirth-2-legacy-eradication-audit.mjs
      - name: Preserve Executive Briefing model/service behavior
        run: node --experimental-strip-types --test tests/executiveBriefing.test.ts
      - name: Full functional regression
        run: npm run test:functional
      - name: Database integrity
        run: npm run db:audit && npm run db:audit:selftest
      - name: TypeScript
        run: npm run typecheck
      - name: Production candidate build
        run: npm run build -- --base=/
      - name: Production asset budget
        run: npm run audit:dist:budget
