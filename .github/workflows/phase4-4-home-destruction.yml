name: ENJAZ Phase 4.4 — Home Destruction Gate

on:
  push:
    branches: [phase-4.4-home-destruction-gate]
  pull_request:
    branches: [main]
    paths:
      - 'src/features/home/**'
      - 'src/ui-v2/screens/HomeScreen.tsx'
      - 'src/ui-v2/runtime/CoreApp.tsx'
      - 'src/ui-v2/styles/home-dashboard.css'
      - 'src/main.tsx'
      - 'tests/homeDashboardDestruction.test.ts'
      - 'scripts/phase4-4-**'
      - 'package.json'
      - '.github/workflows/phase4-4-home-destruction.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enjaz-phase44-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase4-4-home-destruction:
    name: Home Empty / Dense / Conflict / Offline / Responsive Destruction
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Frozen UI V2 boundary
        run: npm run audit:ui-v2:boundary
      - name: Frozen UI V2 visual DNA
        run: npm run audit:ui-v2:dna
      - name: Frozen UI V2 cumulative gates
        run: npm run audit:ui-v2:freeze
      - name: Phase 4.2 cumulative Daily Work
        run: npm run audit:phase4-2:daily-work
      - name: Phase 4.3 cumulative Executive Briefing
        run: npm run audit:phase4-3:executive-briefing
      - name: Phase 4.4 Home destruction architecture
        run: npm run audit:phase4-4:home-destruction
      - name: Phase 4.4 dataset destruction tests
        run: node --experimental-strip-types --test tests/homeDashboardDestruction.test.ts
      - name: Full functional regression baseline
        run: npm run test:functional
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        env:
          VITE_ENJAZ_PREVIEW_MODE: 'true'
        run: npm run build -- --base=/
      - name: Strict production asset budget
        run: npm run audit:dist:budget
      - name: Install Chromium destruction runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start isolated Phase 4.4 preview
        env:
          VITE_ENJAZ_PREVIEW_MODE: 'true'
        run: |
          VITE_ENJAZ_PREVIEW_MODE=true npm run dev -- --host 127.0.0.1 --port 4194 > /tmp/enjaz-phase44-vite.log 2>&1 &
          echo $! > /tmp/enjaz-phase44-vite.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4194 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/enjaz-phase44-vite.log
          exit 1
      - name: Phase 4.4 real Chromium destruction
        env:
          PHASE44_BASE_URL: http://127.0.0.1:4194
          PHASE44_ARTIFACT_DIR: artifacts/phase4-4-home-destruction
        run: node scripts/phase4-4-home-destruction-reality.mjs
      - name: Upload Phase 4.4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-4-home-destruction-evidence-${{ github.sha }}
          path: artifacts/phase4-4-home-destruction
          if-no-files-found: warn
          retention-days: 30
