name: ENJAZ Phase 10.1 — Preact Runtime Probe

on:
  push:
    branches:
      - phase10-1-document-vault

permissions:
  contents: read

jobs:
  preact-budget-probe:
    runs-on: ubuntu-24.04
    env:
      VITE_APP_ENV: production
      VITE_APP_LOG_LEVEL: info
      VITE_SUPABASE_URL: https://juzxriirhkuzviwnhkbd.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_QL0eBUXHR6cSAVbINSkyWA_pIGyQ1oJ
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Install pinned Preact probe only
        run: npm install --no-save --package-lock=false preact@10.27.2
      - name: Inject compatibility aliases without changing repository files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('vite.config.ts')
          s=p.read_text()
          needle='export default defineConfig({\n  plugins:'
          repl="export default defineConfig({\n  resolve: { alias: { 'react': 'preact/compat', 'react-dom': 'preact/compat', 'react-dom/test-utils': 'preact/test-utils', 'react/jsx-runtime': 'preact/jsx-runtime', 'react/jsx-dev-runtime': 'preact/jsx-dev-runtime' } },\n  plugins:"
          if needle not in s:
              raise SystemExit('vite alias insertion point missing')
          p.write_text(s.replace(needle,repl,1))
          PY
      - name: Typecheck source contracts
        run: npm run typecheck
      - name: Build compatibility runtime and enforce unchanged budget
        run: |
          npx vite build --base=/
          npm run audit:dist:budget
