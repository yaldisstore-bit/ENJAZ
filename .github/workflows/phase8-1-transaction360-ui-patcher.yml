name: ENJAZ Phase 8.1 Transaction 360 UI Patcher

on:
  push:
    branches:
      - phase8-1-workflow-government-procedure-os
    paths:
      - .github/workflows/phase8-1-transaction360-ui-patcher.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: phase8-1-workflow-government-procedure-os
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Patch Transaction 360
        run: python3 scripts/phase8-1-transaction360-ui-patch.py
      - run: npm ci --no-audit --no-fund
      - name: Typecheck patched UI
        run: npm run typecheck
      - name: Commit product patch only
        run: |
          git config user.name 'ENJAZ Phase 8.1 UI Patcher'
          git config user.email 'actions@users.noreply.github.com'
          git add src/ui-r2/core-work/CoreWorkConnected.tsx
          git diff --cached --check
          git commit -m 'Surface Phase 8.1 workflow in Transaction 360'
          git push origin HEAD:phase8-1-workflow-government-procedure-os
