name: ENJAZ Phase 8.4 — CRM + Smart Intake M6/M17 Gate

on:
  push:
    branches:
      - main
      - 'phase8-4-*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enjaz-phase84-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase8-4-crm-intake:
    name: CRM / secure intake / authority-boundary gate
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - name: Preserve formally closed Phase 8.3
        run: node scripts/phase8-3-operations-field-audit.mjs && node scripts/phase8-3-cloud-evidence-audit.mjs && node --experimental-strip-types --test tests/fieldOperationsEngine.test.ts
      - name: Enforce Phase 8.4 CRM and Smart Intake contracts
        run: node scripts/phase8-4-crm-intake-audit.mjs
      - name: Phase 8.4 command and authority tests
        run: node --experimental-strip-types --test tests/crmIntakeEngine.test.ts
      - name: Full functional regression
        run: npm run test:functional
      - name: Database and roadmap integrity
        run: npm run db:audit && npm run db:audit:selftest && npm run audit:roadmap
      - name: Secrets and TypeScript
        run: npm run audit:secrets && npm run typecheck
      - name: Production build and unchanged hard budget
        run: npm run build -- --base=/ && npm run audit:dist:budget
      - name: Assert 670000-byte budget was not raised
        run: node -e "const s=require('fs').readFileSync('docs/PHASE8_4_STATE.json','utf8');const j=JSON.parse(s);if(j.javascriptBudgetBytes!==670000||j.budgetIncreaseAllowed!==false)process.exit(1)"
      - name: Upload Phase 8.4 diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: enjaz-phase8-4-diagnostics-${{ github.sha }}
          path: |
            test-results/
          if-no-files-found: ignore
          retention-days: 7
