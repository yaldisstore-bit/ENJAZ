name: ENJAZ UI Rebirth Stage 0

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/ui-rebirth/**'
      - 'scripts/ui-rebirth-boundary-audit.mjs'
      - '.github/workflows/ui-rebirth-stage0.yml'
  push:
    branches:
      - 'ui-rebirth-*'
    paths:
      - 'src/ui-rebirth/**'
      - 'scripts/ui-rebirth-boundary-audit.mjs'
      - '.github/workflows/ui-rebirth-stage0.yml'

jobs:
  clean-visual-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reject legacy visual DNA imports
        run: node scripts/ui-rebirth-boundary-audit.mjs

      - name: TypeScript
        run: npm run typecheck

      - name: Production build
        run: npm run build
