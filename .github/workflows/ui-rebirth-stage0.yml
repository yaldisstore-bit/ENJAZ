name: ENJAZ UI Rebirth Stage 0

# Historical pre-UI-V2 gate. Kept only for explicit legacy-branch verification.
on:
  push:
    branches: ['ui-rebirth-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enjaz-ui-rebirth-stage0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-visual-foundation:
    name: Hard Purge + Clean Visual Foundation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Reject any previous visual runtime
        run: npm run audit:ui-rebirth:boundary && npm run audit:ui-rebirth:purge
      - name: Functional regression baseline
        run: npm run test:functional
      - name: Database integrity
        run: npm run db:audit && npm run db:audit:selftest
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Assert production output
        run: test -f dist/index.html
