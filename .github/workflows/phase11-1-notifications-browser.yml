name: ENJAZ Phase 11.1 — Notifications & Follow-ups Real Browser

on:
  push:
    branches:
      - 'phase11-1-*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase11-1-notifications-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notifications-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Preserve closed Phase 11.1 authority and runtime contracts
        run: |
          node scripts/phase11-1-regression-audit.mjs
          node scripts/phase11-1-live-cloud-probe-audit.mjs
          node --experimental-strip-types --test tests/notificationFollowupContract.test.ts
          node --experimental-strip-types --test tests/notificationCommands.test.ts
          node --experimental-strip-types --test tests/dailyWorkService.test.ts
          npm run typecheck
          npm run db:audit
      - name: Build canonical production and frozen budgets
        run: |
          npm run build -- --base=/
          npm run audit:dist:budget
      - name: Dependency high-severity audit
        run: npm audit --audit-level=high
      - name: Build dedicated Phase 11.1 browser harness
        run: npx vite build --config vite.phase11-1-browser.config.ts --base=/
      - name: Install pinned Chromium tooling
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0 playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start Phase 11.1 browser harness
        run: |
          nohup npx vite preview --config vite.phase11-1-browser.config.ts --host 127.0.0.1 --port 4191 > /tmp/enjaz-phase11-1-browser.log 2>&1 &
          for i in {1..40}; do
            if curl --fail --silent http://127.0.0.1:4191/phase11-1-notifications-browser.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/enjaz-phase11-1-browser.log
          exit 1
      - name: Read/unread / snooze / cancel / RTL 320px browser certificate
        env:
          R2_PHASE111_BASE_URL: http://127.0.0.1:4191/
        run: npx playwright test tests-external/phase11-1-notifications-live.spec.cjs --reporter=line --workers=1
      - name: Upload Phase 11.1 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase11-1-notifications-browser-${{ github.sha }}
          path: |
            artifacts/phase11-1-notifications/
            test-results/
            /tmp/enjaz-phase11-1-browser.log
          if-no-files-found: ignore
          retention-days: 14
