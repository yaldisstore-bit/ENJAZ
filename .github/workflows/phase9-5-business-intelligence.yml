name: ENJAZ Phase 9.5 — Business Intelligence & Forecasting Gate

on:
  push:
    branches:
      - main
      - 'phase9-5-*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enjaz-phase95-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase9-5-business-intelligence:
    name: Provenance / exact money / source composition / additive forecast / M13 lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - name: Preserve predecessor and certified finance anchor
        run: |
          node scripts/phase9-4-regulatory-knowledge-audit.mjs
          node scripts/phase7-3-financial-intelligence-audit.mjs
          node scripts/phase9-5-business-intelligence-audit.mjs
      - name: BI foundation destruction tests
        run: node --experimental-strip-types --test tests/phase9-5-business-intelligence-foundation.test.ts
      - name: BI source composition destruction tests
        run: node --experimental-strip-types --test tests/phase9-5-business-intelligence-service.test.ts
      - name: Full functional regression
        run: npm run test:functional
      - name: Database and roadmap integrity
        run: npm run db:audit && npm run db:audit:selftest && npm run audit:roadmap
      - name: Major systems Zero-Escape governance
        run: node scripts/major-systems-zero-escape-audit.mjs
      - name: Secrets and TypeScript
        run: npm run audit:secrets && npm run typecheck
      - name: Production build and governed budgets
        run: npm run build -- --base=/ && npm run audit:dist:budget
      - name: Real Pages /live build and governed budgets
        run: npm run build -- --base=/ENJAZ/live/ && npm run audit:dist:budget
      - name: Assert Phase 9.5 foundation lifecycle
        run: >-
          node -e "const j=JSON.parse(require('fs').readFileSync('docs/PHASE9_5_STATE.json','utf8'));
          const a=j.authority||{},m=j.majorSystem||{},f=j.foundation||{},t=j.projectQualityConstitution?.tracks||{};
          const ok=j.phase==='9.5'&&j.status==='IN_PROGRESS'&&j.baseCommit==='799873b5c7778c7665c934931af9dd3338bcef47'&&j.javascriptBudgetBytes===670000&&j.budgetIncreaseAllowed===false&&m.id==='M13'&&m.status==='ACTIVE'&&m.globalClosureAllowed===false&&Array.isArray(m.anchors)&&m.anchors.includes('9')&&m.anchors.includes('15')&&a.intelligenceAuthority==='READ_ONLY_DERIVED'&&a.sourceProvenance==='REQUIRED'&&a.forecastAuthority==='DIRECTIONAL_NON_AUTHORITATIVE'&&a.exactMoneyAuthority==='BIGINT_CENTS'&&a.fabricatedHistoryAllowed===false&&a.crossWorkspaceAggregationAllowed===false&&j.exitGatePassed===false&&j.phase9_6Allowed===false&&j.successorStatus==='LOCKED'&&['IN_PROGRESS','LOCAL_GATE_PASS'].includes(f.status)&&t.product==='IN_PROGRESS'&&t.engineering==='IN_PROGRESS';
          if(!ok)process.exit(1)"
