name: ENJAZ Phase 8.1 Bootstrap V4

on:
  push:
    branches:
      - phase8-1-workflow-government-procedure-os
    paths:
      - .github/workflows/phase8-1-bootstrap-patcher-v4.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: phase8-1-workflow-government-procedure-os
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Apply deterministic hardening scripts
        run: |
          python3 scripts/phase8-1-bootstrap-hardening.py
          python3 scripts/phase8-1-audit-bootstrap-fix.py
      - run: npm ci --no-audit --no-fund
      - name: Validate Phase 8.1
        run: |
          npm run audit:phase8-1:workflow-government-procedure
          npm run test:phase8-1
          npm run test:functional
          npm run db:audit
          npm run audit:roadmap
          npm run typecheck
          npm run build -- --base=/
          npm run audit:dist:budget
      - name: Commit validated Phase 8.1
        run: |
          rm -f scripts/phase8-1-audit-bootstrap-fix.py
          git config user.name 'ENJAZ Phase 8.1 Patcher'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Harden Phase 8.1 canonical workflow engine'
          git push origin HEAD:phase8-1-workflow-government-procedure-os
