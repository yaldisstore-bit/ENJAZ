name: ENJAZ Phase 9.4 — Regulatory Knowledge Gate

on:
  push:
    branches:
      - main
      - 'phase9-4-*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enjaz-phase94-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase9-4-regulatory-knowledge:
    name: Provenance / persistence / lineage / derived-AI separation / successor lock
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - name: Preserve Phase 9.3 closure and enforce Phase 9.4 authority
        run: |
          node scripts/phase9-3-governance-ownership-audit.mjs
          node scripts/phase9-4-regulatory-knowledge-audit.mjs
          node scripts/phase9-4-regulatory-persistence-audit.mjs
      - name: Regulatory knowledge foundation destruction tests
        run: node --experimental-strip-types --test tests/phase9-4-regulatory-knowledge-foundation.test.ts
      - name: Regulatory persistence destruction tests
        run: node --experimental-strip-types --test tests/phase9-4-regulatory-knowledge-persistence.test.ts
      - name: Full functional regression
        run: npm run test:functional
      - name: Database and roadmap integrity
        run: npm run db:audit && npm run db:audit:selftest && npm run audit:roadmap
      - name: Major systems Zero-Escape governance
        run: node scripts/major-systems-zero-escape-audit.mjs
      - name: Secrets and TypeScript
        run: npm run audit:secrets && npm run typecheck
      - name: Production build and governed budgets
        run: npm run build -- --base=/ && npm run audit:dist:budget
      - name: Real Pages /live build and governed budgets
        run: npm run build -- --base=/ENJAZ/live/ && npm run audit:dist:budget
      - name: Assert lifecycle and successor lock
        run: >-
          node -e "const j=JSON.parse(require('fs').readFileSync('docs/PHASE9_4_STATE.json','utf8'));
          const a=j.authority||{},m=j.majorSystem||{},f=j.foundation||{},p=j.persistence||{};
          const ok=j.status==='IN_PROGRESS'&&j.javascriptBudgetBytes===670000&&j.budgetIncreaseAllowed===false&&j.exitGatePassed===false&&j.phase9_5Allowed===false&&j.successorStatus==='LOCKED'&&m.id==='M8'&&m.status==='ACTIVE'&&m.globalClosureAllowed===false&&a.officialSourceProvenance==='REQUIRED'&&a.aiOutputAuthority==='NEVER_AUTHORITATIVE'&&a.editorialInterpretationAuthority==='NEVER_AUTHORITATIVE'&&a.directBrowserSensitiveDmlAllowed===false&&a.destructiveHistoryOverwriteAllowed===false&&f.status==='LOCAL_GATE_PASS'&&['IMPLEMENTED_PENDING_STATIC_GATE','STATIC_GATE_PASS','REAL_CLOUD_CERTIFIED'].includes(p.status)&&p.directBrowserTableMutation===false;
          if(!ok)process.exit(1)"
