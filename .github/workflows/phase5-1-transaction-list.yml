name: ENJAZ Phase 5.1 — Transaction List & Search Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enjaz-phase51-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase5-1-transaction-list:
    name: Transaction Search cumulative preservation after Legacy-Zero
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Preserve R2.0-10 Legacy-Zero contract
        run: node scripts/ui-rebirth-2-legacy-eradication-audit.mjs
      - name: Preserve transaction list model/service behavior
        run: npm run test:phase5-1
      - name: Full functional regression
        run: npm run test:functional
      - name: Database integrity
        run: npm run db:audit && npm run db:audit:selftest
      - name: TypeScript
        run: npm run typecheck
      - name: Production candidate build
        run: npm run build -- --base=/
      - name: Production asset budget
        run: npm run audit:dist:budget
