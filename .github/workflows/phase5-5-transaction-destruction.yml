name: ENJAZ Phase 5.5 — Transaction Destruction Gate

on:
  push:
    branches:
      - 'phase5-5-*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enjaz-phase55-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase5-5-transaction-destruction:
    name: Transactions / Destruction / Fail-Closed / Cumulative Phase 5
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Preserve post-R2 guarded unlock
        run: node scripts/ui-rebirth-2-freeze-audit.mjs
      - name: Preserve Legacy-Zero
        run: node scripts/ui-rebirth-2-legacy-eradication-audit.mjs
      - name: Enforce Phase 5.5 machine contract
        run: npm run audit:phase5-5:transaction-destruction
      - name: Attack cumulative transaction behavior
        run: npm run test:phase5-5
      - name: Full functional regression
        run: npm run test:functional
      - name: Secrets audit
        run: npm run audit:secrets
      - name: Database integrity
        run: npm run db:audit && npm run db:audit:selftest
      - name: Roadmap integrity
        run: npm run audit:roadmap
      - name: TypeScript
        run: npm run typecheck
      - name: Production candidate build
        run: npm run build -- --base=/
      - name: Production asset budget
        run: npm run audit:dist:budget
