name: ENJAZ Phase 5.5 — Transaction Destruction Gate

on:
  push:
    branches:
      - 'phase5-5-*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enjaz-phase55-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase5-5-transaction-destruction:
    name: Transactions / Destruction / Fail-Closed / Cumulative Phase 5
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Preserve post-R2 guarded unlock
        run: node scripts/ui-rebirth-2-freeze-audit.mjs
      - name: Preserve Legacy-Zero
        run: node scripts/ui-rebirth-2-legacy-eradication-audit.mjs
      - name: Enforce Phase 5.5 machine contract
        run: npm run audit:phase5-5:transaction-destruction
      - name: Attack cumulative transaction behavior
        run: npm run test:phase5-5
      - name: Full functional regression
        run: npm run test:functional
      - name: Secrets audit
        run: npm run audit:secrets
      - name: Database integrity
        run: npm run db:audit && npm run db:audit:selftest
      - name: Roadmap integrity
        run: npm run audit:roadmap
      - name: TypeScript
        run: npm run typecheck
      - name: Production candidate build
        run: npm run build -- --base=/
      - name: Production asset budget
        run: npm run audit:dist:budget
      - name: Build isolated R2 transaction preview
        run: npx vite build --config vite.r2-preview.config.ts --base=/
      - name: Preserve isolated R2 preview budget
        run: node scripts/ui-rebirth-2-preview-budget-audit.mjs
      - name: Install pinned real-browser tooling
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0 playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start isolated R2 transaction preview
        run: |
          nohup npx vite preview --config vite.r2-preview.config.ts --host 127.0.0.1 --port 4174 > /tmp/enjaz-phase55-preview.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4174/r2-preview.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/enjaz-phase55-preview.log
          exit 1
      - name: Real Chromium transaction destruction
        env:
          PHASE55_BASE_URL: http://127.0.0.1:4174/
          PHASE55_ARTIFACT_DIR: artifacts/phase5-5-transaction-destruction
        run: npx playwright test tests-external/phase5-5-transaction-destruction.spec.cjs --reporter=line --workers=1
      - name: Upload Phase 5.5 browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: enjaz-phase5-5-diagnostics-${{ github.sha }}
          path: |
            test-results/
            artifacts/phase5-5-transaction-destruction/
            /tmp/enjaz-phase55-preview.log
          if-no-files-found: ignore
          retention-days: 7
