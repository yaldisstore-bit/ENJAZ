name: ENJAZ Real Browser Acceptance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enjaz-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-acceptance:
    name: Real Chromium / R2 Cumulative Reality / Legacy-Zero Candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked app dependencies
        run: npm ci --no-audit --no-fund
      - name: QA stage contract lock
        run: npm run audit:qa:stage-contract
      - name: R2 cumulative source contract
        run: |
          node scripts/ui-rebirth-2-freeze-audit.mjs
          node scripts/ui-rebirth-2-palette-audit.mjs
          node scripts/ui-rebirth-2-acceptance-audit.mjs
          node scripts/ui-rebirth-2-shell-audit.mjs
          node scripts/ui-rebirth-2-golden-visual-contract-audit.mjs
          node scripts/ui-rebirth-2-golden-specimen-audit.mjs
          node scripts/ui-rebirth-2-core-work-audit.mjs
          node scripts/ui-rebirth-2-records-audit.mjs
          node scripts/ui-rebirth-2-operational-intelligence-audit.mjs
          node scripts/ui-rebirth-2-zero-lost-audit.mjs
          node scripts/ui-rebirth-2-destruction-reality-audit.mjs
          node scripts/ui-rebirth-2-legacy-eradication-audit.mjs
      - name: Canonical production build
        run: npm run build -- --base=/
      - name: Strict dist budget
        run: node scripts/dist-budget-audit.mjs
      - name: Isolated frozen R2 preview build
        run: npx vite build --config vite.r2-preview.config.ts --base=/
      - name: Strict R2 preview budget
        run: node scripts/ui-rebirth-2-preview-budget-audit.mjs
      - name: Isolated production bridge harness build
        run: npx vite build --config vite.r2-production-test.config.ts --base=/
      - name: Install pinned browser and WCAG tooling
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0 @axe-core/playwright@4.10.2 playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start frozen R2 preview
        run: |
          nohup npx vite preview --config vite.r2-preview.config.ts --host 127.0.0.1 --port 4174 > /tmp/enjaz-r2-preview.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4174/r2-preview.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/enjaz-r2-preview.log
          exit 1
      - name: Start R2 production bridge harness
        run: |
          nohup npx vite preview --config vite.r2-production-test.config.ts --host 127.0.0.1 --port 4176 > /tmp/enjaz-r2-production-bridge.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4176/r2-production-test.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/enjaz-r2-production-bridge.log
          exit 1
      - name: R2 shell reality / 1280 + 430 + 390 + 360 + 320
        env:
          BASE_URL: http://127.0.0.1:4174/
        run: npx playwright test tests-external/r2-shell.spec.cjs --reporter=line --workers=1
      - name: Golden cumulative reality
        env:
          R2_GOLDEN_BASE_URL: http://127.0.0.1:4174/
          R2_GOLDEN_ARTIFACT_DIR: artifacts/r2-golden-cumulative
        run: npx playwright test tests-external/r2-golden.spec.cjs --reporter=line --workers=1
      - name: Core Work cumulative reality
        env:
          R2_CORE_WORK_BASE_URL: http://127.0.0.1:4174/
        run: npx playwright test tests-external/r2-core-work.spec.cjs --reporter=line --workers=1
      - name: Records cumulative reality
        env:
          R2_RECORDS_BASE_URL: http://127.0.0.1:4174/
        run: npx playwright test tests-external/r2-records.spec.cjs --reporter=line --workers=1
      - name: Operational Intelligence cumulative reality
        env:
          R2_OPERATIONAL_BASE_URL: http://127.0.0.1:4174/
        run: npx playwright test tests-external/r2-operational-intelligence.spec.cjs --reporter=line --workers=1
      - name: Zero-Lost cumulative reality
        env:
          R2_ZERO_LOST_BASE_URL: http://127.0.0.1:4174/
          R2_ZERO_LOST_ARTIFACT_DIR: artifacts/r2-zero-lost-cumulative
        run: npx playwright test tests-external/r2-zero-lost.spec.cjs --reporter=line --workers=1
      - name: Destruction reality wave 1
        env:
          R2_DESTRUCTION_BASE_URL: http://127.0.0.1:4174/
          R2_DESTRUCTION_ARTIFACT_DIR: artifacts/r2-destruction-cumulative
        run: npx playwright test tests-external/r2-destruction-reality.spec.cjs --reporter=line --workers=1
      - name: Destruction reality wave 2
        env:
          R2_DESTRUCTION_BASE_URL: http://127.0.0.1:4174/
          R2_DESTRUCTION_ARTIFACT_DIR: artifacts/r2-destruction-cumulative
        run: npx playwright test tests-external/r2-destruction-reality-wave2.spec.cjs --reporter=line --workers=1
      - name: R2 production bridge / Auth + Home + Executive + Account
        env:
          R2_PRODUCTION_BASE_URL: http://127.0.0.1:4176/
        run: npx playwright test tests-external/r2-production-bridge.spec.cjs --reporter=line --workers=1
      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: enjaz-browser-diagnostics-${{ github.sha }}
          path: |
            test-results/
            artifacts/
            /tmp/enjaz-r2-preview.log
            /tmp/enjaz-r2-production-bridge.log
          if-no-files-found: ignore
          retention-days: 7
