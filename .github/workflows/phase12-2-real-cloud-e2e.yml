name: ENJAZ Phase 12.2 — Contextual Assistance Real Cloud

on:
  push:
    branches:
      - phase12-2-contextual-assistance
    paths:
      - 'scripts/phase12-1-real-cloud-e2e.mjs'
      - 'scripts/phase12-2-real-cloud-extension.mjs'
      - 'database/migrations/phase_12_2_contextual_assistance.sql'
      - 'supabase/functions/enjaz-copilot-context/**'
      - 'docs/PHASE12_2_STATE.json'
      - '.github/workflows/phase12-2-real-cloud-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enjaz-phase122-real-cloud
  cancel-in-progress: false

jobs:
  real-cloud:
    name: Auth / Context / Provenance / Isolation / Replay / Zero Residue
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SUPABASE_URL: https://juzxriirhkuzviwnhkbd.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_QL0eBUXHR6cSAVbINSkyWA_pIGyQ1oJ
      SUPABASE_SECRET_KEY: ${{ secrets.ENJAZ_SUPABASE_SECRET_KEY }}
      ENJAZ_REAL_CLOUD_CONFIRM: YES
      ENJAZ_PHASE12_2_EXTENSION: YES
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Require server-only Supabase credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_SECRET_KEY"
          case "$SUPABASE_SECRET_KEY" in sb_publishable_*) exit 1 ;; esac
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Static Real Cloud guards
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/phase12-1-real-cloud-e2e.mjs
          node --check scripts/phase12-2-real-cloud-extension.mjs
          node --test tests/phase12-2-contextual-assistance-source.test.mjs
          if grep -Eq 'sb_secret_[A-Za-z0-9_-]+' scripts/phase12-2-real-cloud-extension.mjs; then exit 1; fi
      - name: Run fresh authenticated Contextual Assistance evidence
        run: node scripts/phase12-1-real-cloud-e2e.mjs
      - name: Upload sanitized 12.2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase12-2-real-cloud-${{ github.sha }}
          path: artifacts/phase12-2-real-cloud/evidence.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload supporting 12.1 boundary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase12-2-foundation-support-${{ github.sha }}
          path: artifacts/phase12-1-real-cloud/evidence.json
          if-no-files-found: error
          retention-days: 14
