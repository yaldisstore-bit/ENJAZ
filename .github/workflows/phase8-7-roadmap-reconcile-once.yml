name: ENJAZ Phase 8.7 — One-shot Roadmap Reconciliation

on:
  push:
    branches:
      - phase8-7-formal-closure

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: phase8-7-formal-closure
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Reconcile Phase 8 closure pointer without deleting historical markers
        run: |
          node <<'NODE'
          const fs = require('fs');

          const roadmapPath = 'docs/ENJAZ_MASTER_ROADMAP.md';
          let roadmap = fs.readFileSync(roadmapPath, 'utf8');

          const oldHeading = '# Current position — canonical reconciled state';
          const historicalHeading = '# Historical current-position snapshot — after Phase 8.1 closure';
          if (roadmap.includes(oldHeading) && !roadmap.includes(historicalHeading)) {
            roadmap = roadmap.replace(oldHeading, historicalHeading);
          }

          roadmap = roadmap.replace(
            '- **M1 — Government Procedure Operating System 🟠 `CLOSURE_CANDIDATE`; 8.1 implementation anchor complete, overall closure remains locked behind Phase 8.7 individual Zero-Escape evidence**',
            '- Historical satisfied marker: **M1 — Government Procedure Operating System 🟠 `CLOSURE_CANDIDATE`; 8.1 implementation anchor complete, overall closure remains locked behind Phase 8.7 individual Zero-Escape evidence**'
          );
          roadmap = roadmap.replace(
            '- **Next: Phase 8.2 — Automation Engine**',
            '- Historical satisfied marker: **Next: Phase 8.2 — Automation Engine**'
          );
          roadmap = roadmap.replace(
            'Phase 8.2 is the only newly authorized implementation stage. Phase 8.1 closure does **not** close M1 overall or Phase 8 overall; M1 final closure remains locked behind its Phase 8.7 individual Zero-Escape destruction evidence, and later Phase-8 stages remain locked behind their predecessor closures and own system evidence.',
            'This snapshot is retained only as satisfied transition history. It no longer defines the canonical next stage.'
          );
          roadmap = roadmap.replace(
            '- **Phase 8.1 ✅ CLOSED + post-merge recertified. M1 implementation anchor is complete, but M1 overall remains `CLOSURE_CANDIDATE` until its individual Phase 8.7 Zero-Escape destruction evidence is satisfied.**',
            '- **Phase 8.1 ✅ CLOSED + post-merge recertified. M1 implementation anchor is complete. Phase 8.7 supplied the required Phase-8 individual destruction evidence; M1 remains `CLOSURE_CANDIDATE` until the separate major-system `ZERO_ESCAPE_V1` closure evidence file satisfies every global M-system requirement (including fresh-workspace coverage where applicable).**'
          );

          const anchor = '\n---\n\n# Major-system anchor matrix';
          const current = `\n---\n\n# Current position — canonical reconciled state\n\n- Phases 0–7 ✅ CLOSED / canonically recertified where required.\n- **Phase 8.1 — Workflow Engine & Government Procedure OS — M1 ✅ CLOSED + post-merge recertified**\n- **Phase 8.2 — Automation Engine ✅ CLOSED + post-merge recertified**\n- **Phase 8.3 — Operations Center + Field Operations — M5 ✅ CLOSED + post-merge recertified**\n- **Phase 8.4 — CRM, Service Catalog & Smart Intake — M6 + M17 ✅ CLOSED + post-merge recertified**\n- **Phase 8.5 — Multi-Branch / Departments / Teams — M15 foundation ✅ CLOSED + post-merge recertified**\n- **Phase 8.6 — Global Command Center ✅ CLOSED + post-merge recertified**\n- **Phase 8.7 — Operations Zero-Escape Destruction Gate ✅ CLOSED + post-merge recertified**\n- **Phase 8 — Workflow, Automation & Operations ✅ CLOSED + post-merge recertified**\n- Phase 8.7 canonical post-merge certification is bound to main SHA \`4334d8ab8e9db6310a07fa23fb9d11fc0665ed16\`: **18/18 exact-main workflows SUCCESS**, Pages Preview/deploy SUCCESS, cumulative Real Browser SUCCESS, and Live External SUCCESS.\n- The repaired live Pages JavaScript remains within the unchanged hard ceiling: **669984 / 670000 bytes PASS**.\n- **M1 / M5 / M6:** remain \`CLOSURE_CANDIDATE\` under the independent M1–M18 \`ZERO_ESCAPE_V1\` law; Phase 8 closure does not fabricate their global system closure.\n- **M15 / M17:** remain \`ACTIVE\` because their governing anchors continue in later phases (15 and 11 respectively).\n- **Next: Phase 9.1 — Smart Risk Engine**\n\nPhase 9.1 is the sole newly authorized implementation stage after the formal Phase 8.7 closure. No later Phase 9 stage is pre-authorized by this transition.\n`;
          if (!roadmap.includes('# Current position — canonical reconciled state')) {
            if (!roadmap.includes(anchor)) throw new Error('major-system anchor marker missing');
            roadmap = roadmap.replace(anchor, current + anchor);
          }

          roadmap = roadmap.replace(
            'This reconciliation makes nine explicit changes:',
            'This reconciliation originally made nine explicit changes and now records a tenth canonical transition:'
          );
          roadmap = roadmap.replace(
            '9. preserves historical transition markers as satisfied history while moving the current pointer forward.',
            '9. preserves historical transition markers as satisfied history while moving the current pointer forward;\n10. records formal Phase 8.7 / Phase 8 closure after exact-main, Pages, Real Browser and Live External recertification, and advances the sole current implementation pointer to Phase 9.1 without prematurely closing M1/M5/M6/M15/M17 globally.'
          );
          roadmap = roadmap.replace(
            'It does **not** silently reopen Phases 0–7, falsely mark M13 or M16 fully closed from their Phase-7 anchors, falsely close M1 before Phase 8.7, mark M2–M18 implemented without their own evidence, close Phase 8 overall from 8.1 closure, or authorize work beyond Phase 8.2.',
            'It does **not** silently reopen Phases 0–7, falsely mark M13 or M16 fully closed from their Phase-7 anchors, falsely close any major M-system without `ZERO_ESCAPE_V1` evidence, mark M2–M18 implemented without their own evidence, or authorize work beyond the currently certified successor.'
          );
          fs.writeFileSync(roadmapPath, roadmap);

          const auditPath = 'scripts/roadmap-audit.mjs';
          let audit = fs.readFileSync(auditPath, 'utf8');
          const marker = "  '**Next: Phase 8.2 — Automation Engine**',\n";
          if (audit.includes(marker) && !audit.includes("'**Next: Phase 9.1 — Smart Risk Engine**'")) {
            audit = audit.replace(marker, marker + "  '**Phase 8.7 — Operations Zero-Escape Destruction Gate ✅ CLOSED + post-merge recertified**',\n  '**Phase 8 — Workflow, Automation & Operations ✅ CLOSED + post-merge recertified**',\n  '**Next: Phase 9.1 — Smart Risk Engine**',\n");
          }
          const staleAnchor = "  '**Phase 8.1 and M1 ✅ CLOSED + post-merge recertified**',\n";
          if (audit.includes(staleAnchor) && !audit.includes("'Phase 8.2 is the only newly authorized implementation stage.'")) {
            audit = audit.replace(staleAnchor, staleAnchor + "  'Phase 8.2 is the only newly authorized implementation stage.',\n");
          }
          audit = audit.replace(
            "console.log('ENJAZ ROADMAP AUDIT PASS — Phases 0-18 ordered; Phase 8.1 CLOSED + exact deployed recertification preserved; M1 remains CLOSURE_CANDIDATE; major systems M1-M18 and Zero-Escape governance are canonical; Phase 8.2 is the only next implementation stage.');",
            "console.log('ENJAZ ROADMAP AUDIT PASS — Phases 0-18 ordered; Phase 8 CLOSED + exact deployed Phase 8.7 recertification recorded; M1/M5/M6 remain closure candidates and M15/M17 active under major-system Zero-Escape governance; Phase 9.1 is the sole next implementation stage.');"
          );
          fs.writeFileSync(auditPath, audit);
          NODE
      - name: Verify roadmap and closure governance after reconciliation
        run: |
          node scripts/roadmap-audit.mjs
          node scripts/phase8-7-closure-audit.mjs
      - name: Commit canonical roadmap reconciliation
        run: |
          if git diff --quiet -- docs/ENJAZ_MASTER_ROADMAP.md scripts/roadmap-audit.mjs; then
            echo 'No reconciliation changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ENJAZ_MASTER_ROADMAP.md scripts/roadmap-audit.mjs
          git commit -m 'Phase 8.7: reconcile roadmap to Phase 9.1'
          git push origin HEAD:phase8-7-formal-closure
