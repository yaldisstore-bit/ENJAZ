name: ENJAZ Phase 13.4 — Reconciliation A1 + A2 Source Gate

on:
  push:
    branches: [phase13-4-reconciliation-a1, phase13-4-reconciliation-a2-readback, main]
    paths:
      - 'docs/PHASE13_4_*'
      - 'src/features/import/legacyReconciliation*.ts'
      - 'database/migrations/phase_13_4_reconciliation_readback.sql'
      - 'tests/phase13-4-*'
      - 'tests/fixtures/phase13-4-*'
      - 'scripts/phase13-4-*'
      - '.github/workflows/phase13-4-reconciliation.yml'
      - 'README.md'
      - 'docs/ENJAZ_MASTER_ROADMAP.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enjaz-phase134-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase13-4-a1:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VITE_APP_ENV: production
      VITE_APP_LOG_LEVEL: info
      VITE_SUPABASE_URL: https://juzxriirhkuzviwnhkbd.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_QL0eBUXHR6cSAVbINSkyWA_pIGyQ1oJ
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Phase 13.4 A1 source and lifecycle audit
        run: node scripts/phase13-4-reconciliation-audit.mjs
      - name: A1 deterministic reconciliation planning and destruction tests
        run: node --experimental-strip-types --test tests/phase13-4-reconciliation-plan.test.ts
      - name: A2 authenticated readback binding and DB-source security tests
        run: |
          node --experimental-strip-types --test tests/phase13-4-reconciliation-readback.test.ts
          node --test tests/phase13-4-reconciliation-db-source.test.mjs
      - name: A2 isolated Real Cloud harness syntax (never invoke cloud here)
        run: node --check scripts/phase13-4-a2-real-cloud-e2e.mjs
      - name: Preserve prior legacy intake mapping and ordered-import authority
        run: |
          node scripts/phase13-1-readonly-legacy-snapshot-intake-audit.mjs
          node scripts/phase13-2-normalize-map-audit.mjs
          node scripts/phase13-3-ordered-import-audit.mjs
          node --experimental-strip-types --test tests/phase13-3-ordered-import.test.ts tests/phase13-3-ordered-import-binding.test.ts tests/phase13-3-ordered-import-execution.test.ts
          node --test tests/phase13-3-ordered-import-db-source.test.mjs
      - name: Full functional + governance regressions
        run: |
          npm run test:functional
          npm run db:audit
          npm run db:audit:selftest
          npm run audit:roadmap
          node scripts/major-systems-zero-escape-audit.mjs
      - name: Secrets + type safety + frozen production budgets
        run: |
          npm run audit:secrets
          npm run typecheck
          npm run build -- --base=/
          npm run audit:dist:budget

  a2-postgres-isolated:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: enjaz_a2_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: enjaz_ephemeral_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d enjaz_a2_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - name: Ensure PostgreSQL client is available
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: Compile actual A2 SQL and test isolated PostgreSQL 17 RLS, ledger and missing-row behavior
        env:
          PGPASSWORD: enjaz_ephemeral_test_only
        run: |
          psql --host=127.0.0.1 --port=5432 --username=postgres \
            --dbname=enjaz_a2_test --set=ON_ERROR_STOP=1 \
            --file=tests/fixtures/phase13-4-a2-postgres.sql
