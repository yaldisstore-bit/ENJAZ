name: ENJAZ Phase 11.4 — Omnichannel Communications M4 Gate

on:
  push:
    branches: [phase11-4-omnichannel-authority, phase11-4-omnichannel-data-model, phase11-4c-governed-actions, phase11-4d-unified-communications]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enjaz-phase11-4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authority:
    name: Canonical communications / transport / governed provider gateway / unified experience / M10 lock
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Phase 11.4-A lifecycle / authority audit
        run: node scripts/phase11-4-omnichannel-audit.mjs
      - name: Preserve Phase 11.3 closed lifecycle compatibility
        run: node scripts/phase11-3-lifecycle-audit-runner.mjs scripts/phase11-3-client-portal-audit.mjs
      - name: Phase 11.4-A executable destruction tests
        run: node --experimental-strip-types --test tests/omnichannelAuthority.test.ts
      - name: Phase 11.4-B exact lifecycle audit when B is current
        shell: bash
        run: |
          if node -e "const s=require('./docs/PHASE11_4_STATE.json');process.exit(s.currentSlice==='11.4-B'?0:1)"; then
            node scripts/phase11-4b-omnichannel-data-model-audit.mjs
          else
            echo '11.4-B exact lifecycle audit is superseded by the active later-slice audit; B destruction tests remain mandatory.'
          fi
      - name: Phase 11.4-B data model destruction tests
        run: node --test tests/omnichannelDataModel.test.mjs
      - name: Phase 11.4-C exact lifecycle audit when C is current
        shell: bash
        run: |
          if node -e "const s=require('./docs/PHASE11_4_STATE.json');process.exit(s.currentSlice==='11.4-C'?0:1)"; then
            node scripts/phase11-4c-governed-actions-audit.mjs
          else
            echo '11.4-C exact lifecycle audit is superseded by the active D audit; C provider destruction tests remain mandatory.'
          fi
      - name: Phase 11.4-C provider cryptography / normalization destruction tests
        run: node --experimental-strip-types --test tests/omnichannelProviderGateway.test.ts
      - name: Phase 11.4-C Edge gateway syntax
        run: node --experimental-strip-types --check supabase/functions/enjaz-communications/index.ts && node --experimental-strip-types --check supabase/functions/enjaz-communications/providerCore.ts
      - name: Phase 11.4-D authenticated staff Edge syntax
        run: node --experimental-strip-types --check supabase/functions/enjaz-communications-user/index.ts
      - name: Phase 11.4-D unified communications authority audit
        run: node scripts/phase11-4d-unified-communications-audit.mjs
      - name: Phase 11.4-D communications service and dispatch bridge tests
        run: node --experimental-strip-types --test tests/communicationsHubService.test.ts tests/communicationsDispatchBridge.test.ts
      - name: Roadmap lifecycle audit
        run: npm run audit:roadmap
      - name: Preserve canonical database baseline integrity
        run: npm run db:audit && npm run db:audit:selftest
      - name: Secrets boundary
        run: npm run audit:secrets
      - name: TypeScript integration baseline
        run: npm run typecheck
      - name: Production build and frozen budgets
        run: npm run build && npm run audit:dist:budget
      - name: Dependency high-severity audit
        run: npm audit --audit-level=high
