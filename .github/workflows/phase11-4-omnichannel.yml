name: ENJAZ Phase 11.4 — Omnichannel Communications M4 Gate

on:
  push:
    branches: [phase11-4-omnichannel-authority, phase11-4-omnichannel-data-model]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enjaz-phase11-4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authority:
    name: Canonical communications / transport model / dedupe / matching / consent / M10 lock
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Phase 11.4-A lifecycle / authority audit
        run: node scripts/phase11-4-omnichannel-audit.mjs
      - name: Preserve Phase 11.3 closed lifecycle compatibility
        run: node scripts/phase11-3-lifecycle-audit-runner.mjs scripts/phase11-3-client-portal-audit.mjs
      - name: Phase 11.4-A executable destruction tests
        run: node --experimental-strip-types --test tests/omnichannelAuthority.test.ts
      - name: Phase 11.4-B data model / Real Cloud evidence audit
        run: node scripts/phase11-4b-omnichannel-data-model-audit.mjs
      - name: Phase 11.4-B data model destruction tests
        run: node --test tests/omnichannelDataModel.test.mjs
      - name: Roadmap lifecycle audit
        run: npm run audit:roadmap
      - name: Preserve canonical database baseline integrity
        run: npm run db:audit && npm run db:audit:selftest
      - name: Secrets boundary
        run: npm run audit:secrets
      - name: TypeScript integration baseline
        run: npm run typecheck
      - name: Production build and frozen budgets
        run: npm run build && npm run audit:dist:budget
      - name: Dependency high-severity audit
        run: npm audit --audit-level=high
