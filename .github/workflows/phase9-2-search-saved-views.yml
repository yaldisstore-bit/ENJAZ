name: ENJAZ Phase 9.2 — Search & Saved Views Gate

on:
  push:
    branches:
      - main
      - 'phase9-2-*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enjaz-phase92-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase9-2-search-saved-views:
    name: Saved views / permission-scoped search / successor lock
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - name: Preserve Phase 9.1 closure and enforce Phase 9.2 contract
        run: |
          node scripts/phase9-1-smart-risk-audit.mjs
          node scripts/phase9-2-search-saved-views-audit.mjs
          node scripts/phase9-2-saved-views-persistence-audit.mjs
          node scripts/phase9-2-global-search-audit.mjs
      - name: Saved-view and search foundation destruction tests
        run: node --experimental-strip-types --test tests/phase9-2-search-saved-views-foundation.test.ts
      - name: Saved-view persistence authority destruction tests
        run: node --experimental-strip-types --test tests/phase9-2-saved-views-persistence.test.ts
      - name: Global-search permission destruction tests
        run: node --experimental-strip-types --test tests/phase9-2-global-search-authority.test.ts
      - name: Full functional regression
        run: npm run test:functional
      - name: Database and roadmap integrity
        run: npm run db:audit && npm run db:audit:selftest && npm run audit:roadmap
      - name: Major systems Zero-Escape governance
        run: node scripts/major-systems-zero-escape-audit.mjs
      - name: Secrets and TypeScript
        run: npm run audit:secrets && npm run typecheck
      - name: Production build and unchanged hard budget
        run: npm run build -- --base=/ && npm run audit:dist:budget
      - name: Real Pages /live build and unchanged hard budget
        run: npm run build -- --base=/ENJAZ/live/ && npm run audit:dist:budget
      - name: Assert authority and lifecycle-correct successor
        run: >-
          node -e "const j=JSON.parse(require('fs').readFileSync('docs/PHASE9_2_STATE.json','utf8'));
          const authority=j.authority?.savedViewsPersistence==='DATABASE_RLS_REQUIRED'&&j.authority?.globalSearchAuthority==='PERMISSION_SCOPED_AUTHORITATIVE_READS_ONLY'&&j.authority?.sourceBusinessEntityWriteAuthority==='none'&&j.javascriptBudgetBytes===670000&&j.budgetIncreaseAllowed===false;
          const lifecycle=j.status==='IN_PROGRESS'?(j.phase9_3Allowed===false&&j.exitGatePassed===false&&j.successorStatus==='LOCKED'):(j.status==='CLOSED'&&j.phase9_3Allowed===true&&j.exitGatePassed===true&&j.nextPhase==='9.3'&&j.successorStatus==='AUTHORIZED');
          if(!authority||!lifecycle)process.exit(1)"
