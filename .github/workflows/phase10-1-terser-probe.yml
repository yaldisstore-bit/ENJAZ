name: ENJAZ Phase 10.1 — Terser Budget Probe

on:
  push:
    branches:
      - phase10-1-document-vault

permissions:
  contents: read

jobs:
  terser-budget-probe:
    runs-on: ubuntu-24.04
    env:
      VITE_APP_ENV: production
      VITE_APP_LOG_LEVEL: info
      VITE_SUPABASE_URL: https://juzxriirhkuzviwnhkbd.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_QL0eBUXHR6cSAVbINSkyWA_pIGyQ1oJ
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Install pinned Terser probe only
        run: npm install --no-save --package-lock=false terser@5.51.2
      - name: Inject multi-pass Terser config without changing repository files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('vite.config.ts')
          s=p.read_text()
          needle='    reportCompressedSize: true,\n    rolldownOptions:'
          repl="    reportCompressedSize: true,\n    minify: 'terser',\n    terserOptions: { compress: { passes: 4, toplevel: true }, mangle: { toplevel: true }, format: { comments: false } },\n    rolldownOptions:"
          if needle not in s:
              raise SystemExit('vite build insertion point missing')
          p.write_text(s.replace(needle,repl,1))
          PY
      - name: Build with multi-pass Terser and enforce unchanged budget
        run: |
          npx vite build --base=/
          npm run audit:dist:budget
