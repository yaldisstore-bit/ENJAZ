name: ENJAZ R2.0-4 — Golden Experience Gate

on:
  push:
    branches:
      - 'r2-0-4-*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  golden-gate:
    name: R2.0-4 / Visual Contract + Regression + Preview Build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Enforce Rebirth freeze
        run: node scripts/ui-rebirth-2-freeze-audit.mjs
      - name: Enforce locked palette
        run: node scripts/ui-rebirth-2-palette-audit.mjs
      - name: Enforce hard Rebirth acceptance barriers
        run: node scripts/ui-rebirth-2-acceptance-audit.mjs
      - name: Preserve frozen Application Shell
        run: node scripts/ui-rebirth-2-shell-audit.mjs
      - name: Enforce user-locked global visual polish contract
        run: node scripts/ui-rebirth-2-golden-visual-contract-audit.mjs
      - name: Functional regression
        run: npm run test:functional
      - name: TypeScript
        run: npm run typecheck
      - name: Build isolated R2.0-4 Golden preview
        run: npx vite build --config vite.r2-preview.config.ts --base=/
      - name: Enforce isolated preview asset budget
        run: node scripts/ui-rebirth-2-preview-budget-audit.mjs
