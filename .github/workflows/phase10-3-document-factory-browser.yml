name: ENJAZ Phase 10.3 — Document Factory Real Browser

on:
  push:
    branches:
      - 'phase10-3-*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase10-3-document-factory-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  document-factory-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      VITE_APP_ENV: production
      VITE_APP_LOG_LEVEL: info
      VITE_SUPABASE_URL: https://juzxriirhkuzviwnhkbd.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_QL0eBUXHR6cSAVbINSkyWA_pIGyQ1oJ
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Preserve governed Document Factory contracts
        run: |
          node scripts/phase10-3-document-factory-audit.mjs
          node --experimental-strip-types --test tests/documentFactory.test.ts
          node --experimental-strip-types --test tests/documentFactoryExpansion.test.ts
          node --experimental-strip-types --test tests/documentFactoryFinalizationGuard.test.ts
          npm run typecheck
          npm run test:functional
          npm run db:audit
          npm run audit:roadmap
      - name: Build canonical production and fixed budget
        run: |
          npm run build -- --base=/
          npm run audit:dist:budget
      - name: Build dedicated Document Factory browser harness
        run: npx vite build --config vite.phase10-3-browser.config.ts --base=/
      - name: Install pinned Chromium tooling
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0 playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start Document Factory browser harness
        run: |
          nohup npx vite preview --config vite.phase10-3-browser.config.ts --host 127.0.0.1 --port 4183 > /tmp/enjaz-phase10-3-browser.log 2>&1 &
          for i in {1..40}; do
            if curl --fail --silent http://127.0.0.1:4183/phase10-3-browser.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/enjaz-phase10-3-browser.log
          exit 1
      - name: Template publish / generate / review / finalize / transaction pack browser journey
        env:
          R2_PHASE103_BASE_URL: http://127.0.0.1:4183/
        run: npx playwright test tests-external/phase10-3-document-factory-live.spec.cjs --reporter=line --workers=1
      - name: Dependency high-severity audit
        run: |
          node --test tests/npm-audit-high-certified-fallback.test.mjs
          node scripts/npm-audit-high-certified-fallback.mjs
      - name: Upload Document Factory browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase10-3-document-factory-browser-${{ github.sha }}
          path: |
            artifacts/phase10-3-document-factory/
            test-results/
            /tmp/enjaz-phase10-3-browser.log
          if-no-files-found: ignore
          retention-days: 14
