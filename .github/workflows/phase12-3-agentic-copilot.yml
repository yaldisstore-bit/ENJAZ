name: ENJAZ Phase 12.3 — Agentic Copilot A3-E Gate

on:
  push:
    branches:
      - main
      - phase12-3-agentic-copilot
    paths:
      - 'docs/PHASE12_3_*.md'
      - 'docs/PHASE12_3_*.json'
      - 'supabase/functions/enjaz-copilot-agent/**'
      - 'database/migrations/phase_12_3_agentic_approval_binding.sql'
      - 'database/migrations/phase_12_3_agentic_approval_fk_index_hardening.sql'
      - 'database/migrations/phase_12_3_agentic_action_followup_snooze.sql'
      - 'database/migrations/phase_12_3_agentic_action_followup_create.sql'
      - 'database/migrations/phase_12_3_agentic_action_schedule_reminder.sql'
      - 'database/migrations/phase_12_3_agentic_schedule_snapshot_rpc_name_hardening.sql'
      - 'database/migrations/phase_12_3_agentic_action_document_request.sql'
      - 'scripts/phase12-3-*'
      - 'tests/phase12-3-*'
      - '.github/workflows/phase12-3-agentic-copilot.yml'
      - 'README.md'
      - 'docs/ENJAZ_MASTER_ROADMAP.md'
      - 'docs/ENJAZ_MAJOR_PRODUCT_SYSTEMS.json'
      - 'scripts/roadmap-audit.mjs'
  pull_request:
    paths:
      - 'docs/PHASE12_3_*.md'
      - 'docs/PHASE12_3_*.json'
      - 'supabase/functions/enjaz-copilot-agent/**'
      - 'database/migrations/phase_12_3_agentic_approval_binding.sql'
      - 'database/migrations/phase_12_3_agentic_approval_fk_index_hardening.sql'
      - 'database/migrations/phase_12_3_agentic_action_followup_snooze.sql'
      - 'database/migrations/phase_12_3_agentic_action_followup_create.sql'
      - 'database/migrations/phase_12_3_agentic_action_schedule_reminder.sql'
      - 'database/migrations/phase_12_3_agentic_schedule_snapshot_rpc_name_hardening.sql'
      - 'scripts/phase12-3-*'
      - 'tests/phase12-3-*'
      - '.github/workflows/phase12-3-agentic-copilot.yml'
      - 'README.md'
      - 'docs/ENJAZ_MASTER_ROADMAP.md'
      - 'docs/ENJAZ_MAJOR_PRODUCT_SYSTEMS.json'
      - 'scripts/roadmap-audit.mjs'

permissions:
  contents: read

jobs:
  phase12-3-a1:
    name: A1+A2+A3-A+A3-B+A3-C+A3-D Preservation / A3-E Document Draft / Destruction / Frozen Budgets
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Phase 12.3 A1 lifecycle and authority audit
        run: node scripts/phase12-3-agentic-copilot-audit.mjs
      - name: Phase 12.3 A1 lifecycle tests
        run: node --test tests/phase12-3-agentic-copilot.test.mjs
      - name: Phase 12.3 A1 agent plan core tests
        run: node --experimental-strip-types --test tests/phase12-3-agentic-copilot-core.test.ts
      - name: Phase 12.3 A1 source destruction tests
        run: node --test tests/phase12-3-agentic-copilot-source.test.mjs
      - name: Phase 12.3 A2 approval core tests
        run: node --experimental-strip-types --test tests/phase12-3-agentic-copilot-approval-core.test.ts
      - name: Phase 12.3 A2 approval source destruction tests
        run: node --test tests/phase12-3-agentic-copilot-approval-source.test.mjs
      - name: Phase 12.3 A2 database authority tests
        run: node --test tests/phase12-3-agentic-copilot-db.test.mjs
      - name: Phase 12.3 A2 Edge authority source tests
        run: node --test tests/phase12-3-agentic-copilot-edge-source.test.mjs
      - name: Phase 12.3 A3-A action core tests
        run: node --experimental-strip-types --test tests/phase12-3-agentic-copilot-action-core.test.ts
      - name: Phase 12.3 A3-A database authority tests
        run: node --test tests/phase12-3-agentic-copilot-action-db.test.mjs
      - name: Phase 12.3 A3-B action create core tests
        run: node --experimental-strip-types --test tests/phase12-3-agentic-copilot-action-create-core.test.ts
      - name: Phase 12.3 A3-B action create database tests
        run: node --test tests/phase12-3-agentic-copilot-action-create-db.test.mjs
      - name: Phase 12.3 A3-C reminder core tests
        run: node --experimental-strip-types --test tests/phase12-3-agentic-copilot-reminder-core.test.ts
      - name: Phase 12.3 A3-C reminder database tests
        run: node --test tests/phase12-3-agentic-copilot-reminder-db.test.mjs
      - name: Phase 12.3 A3-D document request core tests
        run: node --experimental-strip-types --test tests/phase12-3-agentic-copilot-document-request-core.test.ts
      - name: Phase 12.3 A3-D document request database tests
        run: node --test tests/phase12-3-agentic-copilot-document-request-db.test.mjs
      - name: Phase 12.3 A3-E document draft core tests
        run: node --experimental-strip-types --test tests/phase12-3-agentic-copilot-document-draft-core.test.ts
      - name: Phase 12.3 A3-E document draft database tests
        run: node --test tests/phase12-3-agentic-copilot-document-draft-db.test.mjs
      - name: Preserve certified Phase 12.2 contextual assistance
        run: |
          node scripts/phase12-2-contextual-assistance-audit.mjs
          node --test tests/phase12-2-contextual-assistance.test.mjs
          node --experimental-strip-types --test tests/phase12-2-contextual-assistance-core.test.ts
          node --test tests/phase12-2-contextual-assistance-source.test.mjs
          node --test tests/phase12-2-contextual-assistance-ui.test.mjs
      - name: Database and roadmap integrity
        run: |
          python3 database/scripts/audit_schema.py
          python3 database/scripts/audit_selftest.py
          node scripts/roadmap-audit.mjs
      - name: Secrets and TypeScript
        run: |
          node scripts/secret-audit.mjs
          npm run typecheck
      - name: Production build and frozen client budgets
        run: |
          npm run build
          node scripts/dist-budget-audit.mjs
