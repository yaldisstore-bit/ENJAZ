name: ENJAZ Phase 14.1 — Public Lab Phone Tunnel

on:
  push:
    branches: [pages-preview]
    paths: ['.github/workflows/phase14-1-phone-tunnel-public.yml']
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    env:
      TARGET_CANDIDATE_SHA: b7e61b9354591ff4912302ca5d7e6f6fd613c676
      VITE_APP_ENV: test
      VITE_APP_LOG_LEVEL: error
      VITE_SUPABASE_URL: https://nqhgaukutkyvfumbtbtg.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_jIQxb3uimKr7FxHJDF39dg_m4ZAioUy
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: .trycloudflare.com

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_CANDIDATE_SHA }}

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Build exact candidate
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          test "$(git rev-parse HEAD)" = "$TARGET_CANDIDATE_SHA"
          npm run build -- --base=/
          node -e 'const fs=require("fs");fs.writeFileSync("dist/enjaz-phase14-1-a3-deploy.json",JSON.stringify({schema:"enjaz.phase14-1.a3.phone-tunnel.v1",sha:process.env.TARGET_CANDIDATE_SHA,labRef:"nqhgaukutkyvfumbtbtg"})+"\n")'

      - name: Start public HTTPS tunnel and publish temporary URL
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          cf=/tmp/cloudflared
          curl --fail --silent --show-error --location -o "$cf" https://github.com/cloudflare/cloudflared/releases/download/2026.9.1/cloudflared-linux-amd64
          echo "03f1f25d1cc93b9ad6c60569d44060bc4f17ed97075760ed8cfca4b12dcd68cc  $cf" | sha256sum -c -
          chmod +x "$cf"

          nohup node node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 4193 --strictPort >/tmp/vite.log 2>&1 &
          echo $! >/tmp/vite.pid
          for i in {1..60}; do curl --fail --silent http://127.0.0.1:4193/ >/dev/null && break; sleep 1; done
          curl --fail --silent http://127.0.0.1:4193/ >/dev/null

          nohup "$cf" tunnel --url http://127.0.0.1:4193 --no-autoupdate --logfile /tmp/cf.log --loglevel info >/tmp/cf-out.log 2>&1 &
          echo $! >/tmp/cf.pid
          url=
          for i in {1..120}; do
            url=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cf.log | tail -1 || true)
            [ -n "$url" ] && break
            sleep 1
          done
          test -n "$url"
          ready=0
          for i in {1..60}; do
            manifest=$(curl --fail --silent --show-error --location "$url/enjaz-phase14-1-a3-deploy.json" 2>/dev/null || true)
            root=$(curl --fail --silent --show-error --location "$url/" 2>/dev/null || true)
            portal=$(curl --fail --silent --show-error --location "$url/portal" 2>/dev/null || true)
            if printf '%s' "$manifest" | grep -q "$TARGET_CANDIDATE_SHA" &&
               printf '%s' "$root" | grep -q '<div id="root"' &&
               printf '%s' "$portal" | grep -q '<div id="root"'; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = 1

          body=$(printf 'TEMP_PHONE_QA_READY\n\nExact candidate: `%s`\nStaff/register: %s/\nClient portal: %s/portal\nIsolated Supabase lab only; no production data. This URL is temporary.' "$TARGET_CANDIDATE_SHA" "$url" "$url")
          curl --fail --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/issues/225/comments" \
            -d "$(node -e 'process.stdout.write(JSON.stringify({body:process.argv[1]}))' "$body")" >/tmp/comment.json

          echo "PHONE_QA_READY"
          for i in {1..450}; do
            kill -0 "$(cat /tmp/cf.pid)" 2>/dev/null || exit 1
            kill -0 "$(cat /tmp/vite.pid)" 2>/dev/null || exit 1
            sleep 10
          done
