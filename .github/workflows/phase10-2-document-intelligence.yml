name: ENJAZ Phase 10.2 — Document Intelligence / OCR Gate

on:
  push:
    branches:
      - 'phase10-2-*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enjaz-phase102-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase10-2-governance:
    name: Source authority / extraction-review-verify / successor lock
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Phase 10.2 authority kickoff audit
        run: node scripts/phase10-2-document-intelligence-audit.mjs
      - name: Preserve database and roadmap integrity
        run: npm run db:audit && npm run audit:roadmap
      - name: Preserve secret boundary and TypeScript
        run: npm run audit:secrets && npm run typecheck
      - name: Preserve production build and frozen budgets
        run: npm run build -- --base=/ && npm run audit:dist:budget
