name: ENJAZ R2.0-5 — Core Work Migration Gate

on:
  push:
    branches:
      - 'r2-0-5-*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-work-gate:
    name: R2.0-5 / Models + Regression + Real Browser Core Work
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Enforce Phase 5.5 freeze
        run: node scripts/ui-rebirth-2-freeze-audit.mjs
      - name: Enforce locked palette
        run: node scripts/ui-rebirth-2-palette-audit.mjs
      - name: Enforce approved Golden contract
        run: |
          node scripts/ui-rebirth-2-golden-visual-contract-audit.mjs
          node scripts/ui-rebirth-2-golden-specimen-audit.mjs
      - name: Enforce R2.0-5 Core Work contract
        run: node scripts/ui-rebirth-2-core-work-audit.mjs
      - name: Functional regression
        run: npm run test:functional
      - name: TypeScript
        run: npm run typecheck
      - name: Build isolated R2.0-5 preview
        run: npx vite build --config vite.r2-preview.config.ts --base=/
      - name: Enforce isolated preview budget
        run: node scripts/ui-rebirth-2-preview-budget-audit.mjs
      - name: Install pinned Chromium tooling
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0 playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start isolated R2.0-5 preview
        run: |
          nohup npx vite preview --config vite.r2-preview.config.ts --host 127.0.0.1 --port 4174 > /tmp/enjaz-r2-core-preview.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4174/r2-preview.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/enjaz-r2-core-preview.log
          exit 1
      - name: Real browser Core Work acceptance / 1280 + 430 + 390 + 360 + 320
        env:
          R2_CORE_BASE_URL: http://127.0.0.1:4174/
          R2_CORE_ARTIFACT_DIR: artifacts/r2-core-work
        run: npx playwright test tests-external/r2-core-work.spec.cjs --reporter=line --workers=1
      - name: Upload R2.0-5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enjaz-r2-core-work-evidence-${{ github.sha }}
          path: |
            artifacts/r2-core-work/
            test-results/
            /tmp/enjaz-r2-core-preview.log
          if-no-files-found: ignore
          retention-days: 14
