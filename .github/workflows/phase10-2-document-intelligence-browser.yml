name: ENJAZ Phase 10.2 — Document Intelligence Real Browser

on:
  push:
    branches:
      - 'phase10-2-*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase10-2-document-intelligence-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  document-intelligence-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      VITE_APP_ENV: production
      VITE_APP_LOG_LEVEL: info
      VITE_SUPABASE_URL: https://juzxriirhkuzviwnhkbd.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_QL0eBUXHR6cSAVbINSkyWA_pIGyQ1oJ
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Preserve governed OCR contracts and predecessor vault
        run: |
          node scripts/phase10-2-document-intelligence-audit.mjs
          node --experimental-strip-types --test tests/documentIntelligence.test.ts
          node --experimental-strip-types --test tests/documentVault.test.ts
          npm run typecheck
          npm run test:functional
          npm run db:audit
          npm run audit:roadmap
      - name: Build canonical production and fixed budget
        run: |
          npm run build -- --base=/
          npm run audit:dist:budget
      - name: Build dedicated Document Intelligence browser harness
        run: npx vite build --config vite.phase10-2-browser.config.ts --base=/
      - name: Install pinned Chromium tooling
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0 playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start Document Intelligence browser harness
        run: |
          nohup npx vite preview --config vite.phase10-2-browser.config.ts --host 127.0.0.1 --port 4182 > /tmp/enjaz-phase10-2-browser.log 2>&1 &
          for i in {1..40}; do
            if curl --fail --silent http://127.0.0.1:4182/phase10-2-browser.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/enjaz-phase10-2-browser.log
          exit 1
      - name: OCR reality / extract + correction + review + verify + stale-source invalidation
        env:
          R2_PHASE102_BASE_URL: http://127.0.0.1:4182/
        run: npx playwright test tests-external/phase10-2-document-intelligence-live.spec.cjs --reporter=line --workers=1
      - name: Dependency high-severity audit
        run: npm audit --audit-level=high
      - name: Upload Document Intelligence browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase10-2-document-intelligence-browser-${{ github.sha }}
          path: |
            artifacts/phase10-2-document-intelligence/
            test-results/
            /tmp/enjaz-phase10-2-browser.log
          if-no-files-found: ignore
          retention-days: 14
