name: ENJAZ Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enjaz-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Extreme Integrity + UI Rebirth + Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate runtime contract
        run: node -e "const p=require('./package.json'); if(p.engines.node !== '>=22.22.0') process.exit(1)"
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Reject previous visual runtime
        run: npm run audit:ui-rebirth:boundary && npm run audit:ui-rebirth:purge
      - name: App Shell structural + destructive gate
        run: npm run audit:ui-rebirth:shell && npm run audit:ui-rebirth:shell:selftest
      - name: Extreme professional UI contract
        run: npm run audit:ui-rebirth:extreme
      - name: Extreme deliberate-regression mutation gate
        run: npm run audit:ui-rebirth:extreme:selftest
      - name: Functional regression baseline
        run: npm run test:functional
      - name: Secrets audit
        run: npm run audit:secrets
      - name: Database integrity
        run: npm run db:audit && npm run db:audit:selftest
      - name: Roadmap integrity
        run: npm run audit:roadmap
      - name: Real TypeScript check
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Strict production asset budget
        run: npm run audit:dist:budget
      - name: Assert production output
        run: test -f dist/index.html
      - name: Retain verified production build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: enjaz-preview-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
