name: ENJAZ Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enjaz-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Canonical Integrity + R2 Legacy-Zero Candidate + Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate runtime contract
        run: node -e "const p=require('./package.json'); if(p.engines.node !== '>=22.22.0') process.exit(1)"
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: QA stage contract lock
        run: npm run audit:qa:stage-contract
      - name: Stage-specific test expansion gate
        run: npm run audit:qa:stage-delta
      - name: Rebirth 2.0 cumulative governance
        run: |
          node scripts/ui-rebirth-2-freeze-audit.mjs
          node scripts/ui-rebirth-2-palette-audit.mjs
          node scripts/ui-rebirth-2-acceptance-audit.mjs
          node scripts/ui-rebirth-2-shell-audit.mjs
          node scripts/ui-rebirth-2-golden-visual-contract-audit.mjs
          node scripts/ui-rebirth-2-golden-specimen-audit.mjs
          node scripts/ui-rebirth-2-core-work-audit.mjs
          node scripts/ui-rebirth-2-records-audit.mjs
          node scripts/ui-rebirth-2-operational-intelligence-audit.mjs
          node scripts/ui-rebirth-2-zero-lost-audit.mjs
          node scripts/ui-rebirth-2-destruction-reality-audit.mjs
          node scripts/ui-rebirth-2-legacy-eradication-audit.mjs
      - name: Phase 5 model and service regressions
        run: |
          npm run test:phase5-2
          npm run test:phase5-3
          npm run test:phase5-4
      - name: Functional regression baseline
        run: npm run test:functional
      - name: Secrets audit
        run: npm run audit:secrets
      - name: Database integrity
        run: npm run db:audit && npm run db:audit:selftest
      - name: Roadmap integrity
        run: npm run audit:roadmap
      - name: Real TypeScript check
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Strict production asset budget
        run: npm run audit:dist:budget
      - name: Assert production output
        run: test -f dist/index.html
      - name: Retain verified production build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: enjaz-preview-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
