name: ENJAZ Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enjaz-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests, Audits, Types and Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate runtime contract
        run: node -e "const p=require('./package.json'); if(p.engines.node !== '>=22.22.0') process.exit(1)"
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Full Phase 2.7 verification
        run: npm run verify:phase2.7
      - name: Roadmap integrity audit
        run: npm run audit:roadmap
      - name: Real TypeScript check
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Assert production output
        run: test -f dist/index.html
      - name: Retain verified production build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: enjaz-preview-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
