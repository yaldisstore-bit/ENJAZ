name: ENJAZ Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enjaz-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Canonical Main Integrity + UI V2 + Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate runtime contract
        run: node -e "const p=require('./package.json'); if(p.engines.node !== '>=22.22.0') process.exit(1)"
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: QA stage contract lock
        run: npm run audit:qa:stage-contract
      - name: Stage-specific test expansion gate
        run: npm run audit:qa:stage-delta
      - name: UI V2 clean-boundary gate
        run: npm run audit:ui-v2:boundary
      - name: UI V2 visual DNA gate
        run: npm run audit:ui-v2:dna
      - name: UI V2 cumulative structural gates
        run: |
          node scripts/ui4-shell-audit.mjs
          node scripts/ui5-composition-audit.mjs
          node scripts/ui6-core-audit.mjs
          node scripts/ui7-domain-audit.mjs
          node scripts/ui8-states-audit.mjs
          node scripts/ui9-mobile-audit.mjs
          node scripts/ui10-freeze-audit.mjs
      - name: Phase 4.2 Daily Work architecture gate
        run: node scripts/phase4-2-daily-work-audit.mjs
      - name: Phase 4.3 Executive Briefing architecture gate
        run: node scripts/phase4-3-executive-briefing-audit.mjs
      - name: Phase 4.4 Home destruction architecture gate
        run: node scripts/phase4-4-home-destruction-audit.mjs
      - name: Functional regression baseline
        run: npm run test:functional
      - name: Secrets audit
        run: npm run audit:secrets
      - name: Database integrity
        run: npm run db:audit && npm run db:audit:selftest
      - name: Roadmap integrity
        run: npm run audit:roadmap
      - name: Real TypeScript check
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Strict production asset budget
        run: npm run audit:dist:budget
      - name: Assert production output
        run: test -f dist/index.html
      - name: Retain verified production build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: enjaz-preview-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
