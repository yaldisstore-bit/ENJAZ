name: ENJAZ Phase 11.2 — Universal Inbox Integration Gate

on:
  push:
    branches:
      - 'phase11-2-*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: enjaz-phase112-universal-inbox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  universal-inbox:
    name: Source authority / provenance merge / deterministic dedupe / no shadow inbox
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Phase 11.2 governed composition / closed regression audit
        run: node scripts/phase11-2-regression-audit.mjs
      - name: Phase 11.2 composition and service destruction tests
        run: |
          node --experimental-strip-types --test tests/universalInboxContract.test.ts
          node --experimental-strip-types --test tests/universalInboxService.test.ts
      - name: Preserve live Phase 4.2 Daily Work domain/service behavior
        run: |
          node --experimental-strip-types --test tests/dailyWork.test.ts
          node --experimental-strip-types --test tests/dailyWorkService.test.ts
      - name: Preserve closed Phase 11.1 notification authority
        run: |
          node scripts/phase11-1-regression-audit.mjs
          node scripts/phase11-1-live-cloud-probe-audit.mjs
          node --experimental-strip-types --test tests/notificationFollowupContract.test.ts
          node --experimental-strip-types --test tests/notificationCommands.test.ts
      - name: Secrets and database integrity
        run: |
          npm run audit:secrets
          npm run db:audit
          npm run db:audit:selftest
      - name: TypeScript integration
        run: npm run typecheck
      - name: Production build and frozen budgets
        run: npm run build -- --base=/ && npm run audit:dist:budget
      - name: Dependency high-severity audit
        run: npm audit --audit-level=high
      - name: One-shot closure documentation reconciliation
        if: github.event_name == 'push' && github.ref_name == 'phase11-2-formal-closure' && github.actor != 'github-actions[bot]'
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          readme_path = Path('README.md')
          readme = readme_path.read_text()
          readme = replace_once(
              readme,
              'الحالة الرسمية: **Phase 11.1 — Notifications & Follow-ups ✅ CLOSED + REAL-CLOUD / FINAL-HEAD / EXACT-MAIN / REAL-BROWSER / PAGES / LIVE-EXTERNAL CERTIFIED**  \nآخر مرحلة مغلقة: **Phase 11.1 — Notifications & Follow-ups ✅ CLOSED**  \nالمرحلة التالية: **Phase 11.2 — Universal Inbox Integration — AUTHORIZED NEXT**.',
              'الحالة الرسمية: **Phase 11.2 — Universal Inbox Integration ✅ CLOSED + FINAL-HEAD / EXACT-MAIN / REAL-BROWSER / PAGES / LIVE-EXTERNAL CERTIFIED**  \nآخر مرحلة مغلقة: **Phase 11.2 — Universal Inbox Integration ✅ CLOSED**  \nالمرحلة التالية: **Phase 11.3 — Client Portal — M3 — AUTHORIZED NEXT**؛ ويبقى M3 `PLANNED` حتى kickoff المرحلة.',
              'README current banner',
          )
          readme = replace_once(
              readme,
              '- **Phase 11.2 — Universal Inbox Integration: AUTHORIZED NEXT.**\n\n## Phase 11.1 — دليل الإغلاق الحالي',
              '- **Phase 11.2 — Universal Inbox Integration: ✅ CLOSED + final-head Gate + dedicated Real Browser + exact-main cumulative gates + Pages + Live External certified.**\n- **Phase 11.3 — Client Portal — M3: AUTHORIZED NEXT؛ M3 يبقى `PLANNED` حتى kickoff.**\n\n## Phase 11.2 — دليل الإغلاق الحالي\n\n- implementation PR #164: **MERGED** → `c9b52706efd86e391518f82b321b16e72aa81a3d`.\n- final certified branch head `e29411298ff7404ae856fe5e523b20ae55acdb7d`.\n- Phase 11.2 Gate `34894910063`: **PASS**.\n- dedicated Phase 11.2 Real Browser `34894909604`: **PASS** على 1280 / 430 / 390 / 360 / 320؛ artifact `10368233930`.\n- exact-main Quality `34895596588` وcumulative Real Browser `34895596605`: **PASS**.\n- exact-main UI Governance `34895596647`, Project Constitution `34895596366`, Major Systems Zero-Escape `34895596305`: **PASS**.\n- Pages Preview `34895657976` + Pages deployment `34895594979`: **PASS**.\n- Live External `34895738781`: **PASS**.\n- unresolved / critical / high / functional blockers: **0 / 0 / 0 / 0**.\n- closure evidence: [`docs/PHASE11_2_CLOSURE.md`](docs/PHASE11_2_CLOSURE.md).\n- **Phase 11.3 — Client Portal — M3: AUTHORIZED NEXT؛ M3 يبقى `PLANNED` حتى kickoff.**\n\n## Phase 11.1 — دليل الإغلاق المحفوظ',
              'README canonical 11.2 block',
          )
          readme = replace_once(
              readme,
              '- **Phase 11.2 — Universal Inbox Integration: AUTHORIZED NEXT.**\n\n## Phase 10.6 — دليل الإغلاق المحفوظ',
              '- **Phase 11.3 — Client Portal — M3: AUTHORIZED NEXT؛ M3 يبقى `PLANNED` حتى kickoff.**\n\n## Phase 10.6 — دليل الإغلاق المحفوظ',
              'README archived 11.1 successor line',
          )
          readme_path.write_text(readme)

          roadmap_path = Path('docs/ENJAZ_MASTER_ROADMAP.md')
          roadmap = roadmap_path.read_text()
          roadmap = replace_once(
              roadmap,
              '- **Phases 10.1–10.6 are formally CLOSED and certified; Phase 11.1 — Notifications & Follow-ups is the sole authorized successor.**',
              '- **Phases 10.1–10.6 and Phases 11.1–11.2 are formally CLOSED and certified; Phase 11.3 — Client Portal — M3 is the sole authorized successor. M3 remains `PLANNED` until the governed Phase 11.3 kickoff.**',
              'roadmap governing banner',
          )
          roadmap = replace_once(
              roadmap,
              '- Historical transition note: Phase 10.1 was authorized at Phase 9.7 closure; Phases 10.1–10.6 have since CLOSED with governed evidence. **Phase 11.1 — Notifications & Follow-ups is now AUTHORIZED NEXT.**',
              '- Historical transition note: Phase 10.1 was authorized at Phase 9.7 closure; Phases 10.1–10.6 and Phases 11.1–11.2 have since CLOSED with governed evidence. **Phase 11.3 — Client Portal — M3 is now AUTHORIZED NEXT; M3 remains `PLANNED` until kickoff.**',
              'roadmap historical transition reconciliation',
          )
          roadmap_path.write_text(roadmap)

          marker = Path('docs/PHASE11_2_README_SYNC_REQUIRED.md')
          if marker.exists():
              marker.unlink()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md docs/ENJAZ_MASTER_ROADMAP.md docs/PHASE11_2_README_SYNC_REQUIRED.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Closure documentation already reconciled.'
            exit 0
          fi
          git commit -m 'docs: reconcile current position through Phase 11.2 closure'
          git push origin HEAD:phase11-2-formal-closure
