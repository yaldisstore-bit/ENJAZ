name: ENJAZ Phase 5.4 — Archive / Restore / Lifecycle Gate

on:
  push:
    branches: [main, phase-5.4-archive-restore-lifecycle]
  pull_request:
    branches: [main]
    paths:
      - 'src/features/transactions/**'
      - 'src/data/createDataLayer.ts'
      - 'src/ui-v2/runtime/CoreApp.tsx'
      - 'src/ui-v2/screens/TransactionListScreen.tsx'
      - 'src/ui-v2/screens/TransactionLifecyclePanel.tsx'
      - 'src/ui-v2/screens/Transaction360.tsx'
      - 'src/ui-v2/styles/transaction-list.css'
      - 'src/ui-v2/styles/transaction-lifecycle.css'
      - 'src/main.tsx'
      - 'tests/transactionLifecycle*.test.ts'
      - 'scripts/phase5-4-**'
      - 'scripts/phase5-3-transaction-360-audit.mjs'
      - 'scripts/phase5-3-transaction-360-reality.mjs'
      - 'scripts/roadmap-audit.mjs'
      - 'package.json'
      - '.github/workflows/phase5-4-transaction-lifecycle.yml'
      - '.github/workflows/enjaz-quality-gate.yml'
      - '.github/workflows/enjaz-browser-acceptance.yml'
      - 'docs/ENJAZ_MASTER_ROADMAP.md'
      - 'docs/PHASE5_4_**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enjaz-phase54-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase5-4-transaction-lifecycle:
    name: Archive / Restore / Reactivate / Mobile Destruction
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: QA stage contract lock
        run: npm run audit:qa:stage-contract
      - name: Frozen UI V2 boundary
        run: npm run audit:ui-v2:boundary
      - name: Frozen UI V2 visual DNA
        run: npm run audit:ui-v2:dna
      - name: Frozen UI V2 cumulative gates
        run: npm run audit:ui-v2:freeze
      - name: Phase 4.2 cumulative Daily Work
        run: npm run audit:phase4-2:daily-work
      - name: Phase 4.3 cumulative Executive Briefing
        run: npm run audit:phase4-3:executive-briefing
      - name: Phase 4.4 cumulative Home destruction
        run: npm run audit:phase4-4:home-destruction
      - name: Phase 5.1 cumulative Transaction List
        run: npm run audit:phase5-1:transactions
      - name: Phase 5.2 cumulative Transaction Create/Edit
        run: npm run audit:phase5-2:transaction-editor && npm run test:phase5-2
      - name: Phase 5.3 cumulative Transaction 360
        run: npm run audit:phase5-3:transaction-360 && npm run test:phase5-3
      - name: Phase 5.4 lifecycle architecture
        run: npm run audit:phase5-4:transaction-lifecycle
      - name: Phase 5.4 lifecycle model/service destruction
        run: npm run test:phase5-4
      - name: Full functional regression baseline
        run: npm run test:functional
      - name: Secrets audit
        run: npm run audit:secrets
      - name: Roadmap integrity
        run: npm run audit:roadmap
      - name: Database integrity
        run: npm run db:audit && npm run db:audit:selftest
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        env:
          VITE_ENJAZ_PREVIEW_MODE: 'true'
        run: npm run build -- --base=/
      - name: Strict production asset budget
        run: npm run audit:dist:budget
      - name: Install Chromium destruction runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start isolated Phase 5.4 preview
        env:
          VITE_ENJAZ_PREVIEW_MODE: 'true'
        run: |
          VITE_ENJAZ_PREVIEW_MODE=true npm run dev -- --host 127.0.0.1 --port 4198 > /tmp/enjaz-phase54-vite.log 2>&1 &
          echo $! > /tmp/enjaz-phase54-vite.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4198 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/enjaz-phase54-vite.log
          exit 1
      - name: Phase 5.4 real Chromium lifecycle destruction
        env:
          PHASE54_BASE_URL: http://127.0.0.1:4198
          PHASE54_ARTIFACT_DIR: artifacts/phase5-4-transaction-lifecycle
        run: node scripts/phase5-4-transaction-lifecycle-reality.mjs
      - name: Upload Phase 5.4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5-4-transaction-lifecycle-evidence-${{ github.sha }}
          path: artifacts/phase5-4-transaction-lifecycle
          if-no-files-found: warn
          retention-days: 30
