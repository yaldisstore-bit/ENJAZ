name: ENJAZ Phase 8.3 — Operations + Field M5 Gate

on:
  push:
    branches:
      - main
      - 'phase8-3-*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enjaz-phase83-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase8-3-operations-field:
    name: Operations / field / offline / Real Chromium gate
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - name: Preserve closed Phase 8.2
        run: node scripts/phase8-2-automation-audit.mjs && node --experimental-strip-types --test tests/automationEngine.test.ts
      - name: Enforce Phase 8.3 operations, field and cloud evidence contracts
        run: node scripts/phase8-3-operations-field-audit.mjs && node scripts/phase8-3-cloud-evidence-audit.mjs
      - name: Phase 8.3 command and offline tests
        run: node --experimental-strip-types --test tests/fieldOperationsEngine.test.ts
      - name: Full functional regression
        run: npm run test:functional
      - name: Database and roadmap integrity
        run: npm run db:audit && npm run db:audit:selftest && npm run audit:roadmap
      - name: Secrets and TypeScript
        run: npm run audit:secrets && npm run typecheck
      - name: Production build and hard budget
        run: npm run build -- --base=/ && npm run audit:dist:budget
      - name: Build isolated Phase 8.3 operations preview
        run: npx vite build --config vite.phase8-3-preview.config.ts --base=/
      - name: Enforce isolated Phase 8.3 preview size
        run: |
          test -f dist-phase8-3-preview/phase8-3-preview.html
          BYTES=$(du -sb dist-phase8-3-preview | cut -f1)
          echo "Phase 8.3 preview bytes: $BYTES"
          test "$BYTES" -le 10485760
      - name: Install pinned real-browser tooling
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0 playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start isolated Phase 8.3 preview
        run: |
          nohup npx vite preview --config vite.phase8-3-preview.config.ts --host 127.0.0.1 --port 4183 > /tmp/enjaz-phase83-preview.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4183/phase8-3-preview.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/enjaz-phase83-preview.log
          exit 1
      - name: Real Chromium Phase 8.3 acceptance
        env:
          PHASE83_BASE_URL: http://127.0.0.1:4183/
        run: npx playwright test tests-external/phase8-3-operations-field.spec.cjs --reporter=line --workers=1
      - name: Upload Phase 8.3 diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: enjaz-phase8-3-diagnostics-${{ github.sha }}
          path: |
            test-results/
            /tmp/enjaz-phase83-preview.log
          if-no-files-found: ignore
          retention-days: 7
