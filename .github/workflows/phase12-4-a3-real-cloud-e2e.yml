name: ENJAZ Phase 12.4 — Regulatory Knowledge Assistance A3 Real Cloud

on:
  push:
    branches:
      - phase12-4-regulatory-knowledge-assistance
    paths:
      - '.github/workflows/phase12-4-a3-real-cloud-e2e.yml'
      - 'scripts/phase12-4-a2-real-cloud-e2e.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enjaz-phase124-a3-real-cloud
  cancel-in-progress: false

jobs:
  real-cloud:
    # QUARANTINED: legacy fixture runner must not mutate production.
    if: ${{ false }}
    name: Edge v3 Safety Replay / Binding Guards / Empty-Store Fail-Closed / Zero Mutation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SUPABASE_URL: https://juzxriirhkuzviwnhkbd.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_QL0eBUXHR6cSAVbINSkyWA_pIGyQ1oJ
      SUPABASE_SECRET_KEY: ${{ secrets.ENJAZ_SUPABASE_SECRET_KEY }}
      ENJAZ_REAL_CLOUD_CONFIRM: YES
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Require server-only setup credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_SECRET_KEY"
          case "$SUPABASE_SECRET_KEY" in sb_publishable_*) exit 1 ;; esac
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: A3 binding and authority guards
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/phase12-4-regulatory-assistance-edge-source.test.mjs
          node --experimental-strip-types --test tests/phase12-4-regulatory-assistance-binding.test.ts
          node --experimental-strip-types --test tests/phase9-4-regulatory-runtime.test.ts
          grep -F "ENJAZ_P94_RUNTIME_PROBE_ROLLBACK" database/migrations/phase_9_4_runtime_authenticated_behavioral_probe.sql
          grep -F "residue after rollback" database/migrations/phase_9_4_runtime_authenticated_behavioral_probe.sql
          node --check scripts/phase12-4-a2-real-cloud-e2e.mjs
      - name: Run authenticated live safety replay against Edge v3
        run: node scripts/phase12-4-a2-real-cloud-e2e.mjs
      - name: Upload sanitized A3 live-safety evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase12-4-a3-real-cloud-${{ github.sha }}
          path: artifacts/phase12-4-a2-real-cloud/evidence.json
          if-no-files-found: error
          retention-days: 14
