name: ENJAZ R2.0-8 — Materialize Verified Closure

on:
  push:
    branches:
      - r2-0-8-find-anything-zero-lost

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout verified branch
        uses: actions/checkout@v7
        with:
          ref: r2-0-8-find-anything-zero-lost
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Materialize fail-closed closure records
        run: node scripts/r2-0-8-materialize-closure.mjs
      - name: Commit closure state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/UI_UX_REBIRTH_2_0_FEATURE_PARITY.json docs/UI_UX_REBIRTH_2_0_STATE.json docs/UI_UX_REBIRTH_2_0_ZERO_LOST_EVIDENCE.json docs/R2_0_8_FIND_ANYTHING_ZERO_LOST_CLOSURE.md
          git diff --cached --quiet && { echo "No closure changes produced"; exit 1; }
          git commit -m "Close R2.0-8 Find Anything and Zero-Lost UX"
          git push origin HEAD:r2-0-8-find-anything-zero-lost
