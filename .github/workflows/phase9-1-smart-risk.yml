name: ENJAZ Phase 9.1 — Smart Risk Engine Gate

on:
  push:
    branches:
      - main
      - 'phase9-1-*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enjaz-phase91-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase9-1-smart-risk:
    name: Explainable signals / read-only authority / fail-closed evidence
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - name: Preserve formal Phase 8 closure and enforce Phase 9.1 authority contract
        run: |
          node scripts/phase8-7-closure-audit.mjs
          node scripts/phase9-1-smart-risk-audit.mjs
      - name: Smart Risk deterministic destruction tests
        run: node --experimental-strip-types --test tests/smartRiskEngine.test.ts tests/riskService.test.ts
      - name: Full functional regression
        run: npm run test:functional
      - name: Database and roadmap integrity
        run: npm run db:audit && npm run db:audit:selftest && npm run audit:roadmap
      - name: Major systems Zero-Escape governance
        run: node scripts/major-systems-zero-escape-audit.mjs
      - name: Secrets and TypeScript
        run: npm run audit:secrets && npm run typecheck
      - name: Production build and unchanged hard budget
        run: npm run build -- --base=/ && npm run audit:dist:budget
      - name: Real Pages /live build and unchanged hard budget
        run: npm run build -- --base=/ENJAZ/live/ && npm run audit:dist:budget
      - name: Assert read-only authority, frozen budget and Phase 9.2 lock
        run: >-
          node -e "const j=JSON.parse(require('fs').readFileSync('docs/PHASE9_1_STATE.json','utf8'));
          if(j.authority?.mode!=='READ_ONLY_DERIVED_INTELLIGENCE'||j.authority?.riskOwnedTables!=='NONE'||j.authority?.riskOwnedWriteRpc!=='NONE'||j.javascriptBudgetBytes!==670000||j.budgetIncreaseAllowed!==false||j.phase9_2Allowed!==false||j.exitGatePassed!==false)process.exit(1)"
