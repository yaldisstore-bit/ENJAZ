name: ENJAZ Phase 8.2 — TypeScript patcher

on:
  push:
    branches:
      - phase8-2-automation-engine
    paths:
      - .github/workflows/phase8-2-typescript-patcher.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: phase8-2-automation-engine
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Apply exact TypeScript fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              return text.replace(old, new, 1)

          path = Path('src/features/automation/automationCommands.ts')
          s = path.read_text()
          replacements = [
              ('async loadContext(workspaceId)', 'async loadContext(workspaceId: string)', 'loadContext type'),
              ('async upsertRule(input)', 'async upsertRule(input: UpsertAutomationRuleInput)', 'upsertRule type'),
              ('async setRuleEnabled(workspaceId, ruleId, expectedVersion, enabled)', 'async setRuleEnabled(workspaceId: string, ruleId: string, expectedVersion: number, enabled: boolean)', 'setRuleEnabled types'),
              ('async dispatch(workspaceId, ruleId, eventKey, payload, receiptKey)', 'async dispatch(workspaceId: string, ruleId: string, eventKey: string, payload: Readonly<Record<string, unknown>>, receiptKey: string)', 'dispatch types'),
              ('async decideApproval(workspaceId, approvalId, decision, note, decisionKey)', 'async decideApproval(workspaceId: string, approvalId: string, decision: AutomationApprovalDecision, note: string | null, decisionKey: string)', 'decideApproval types'),
          ]
          for old, new, label in replacements:
              s = replace_once(s, old, new, label)
          path.write_text(s)

          test_path = Path('tests/automationEngine.test.ts')
          t = test_path.read_text()
          count = t.count('let captured: Readonly<Record<string, unknown>> | null = null;')
          if count != 3:
              raise SystemExit(f'capture declarations: expected 3, got {count}')
          t = t.replace('let captured: Readonly<Record<string, unknown>> | null = null;', 'let captured: Record<string, unknown> = {};')
          count = t.count('captured = args;')
          if count != 3:
              raise SystemExit(f'capture assignments: expected 3, got {count}')
          t = t.replace('captured = args;', 'captured = { ...args };')
          for old, new in [
              ('captured?.p_rule_key', "captured['p_rule_key']"),
              ('captured?.p_expected_version', "captured['p_expected_version']"),
              ('captured?.p_receipt_key', "captured['p_receipt_key']"),
              ('captured?.p_decision_key', "captured['p_decision_key']"),
          ]:
              t = replace_once(t, old, new, old)
          test_path.write_text(t)
          PY
      - run: npm ci --no-audit --no-fund
      - name: Verify exact fixes
        run: |
          node scripts/phase8-2-automation-audit.mjs
          node --experimental-strip-types --test tests/automationEngine.test.ts
          npm run typecheck
      - name: Commit validated source and test fixes
        run: |
          git config user.name 'ENJAZ Phase 8.2 Patcher'
          git config user.email 'actions@users.noreply.github.com'
          git add src/features/automation/automationCommands.ts tests/automationEngine.test.ts
          git diff --cached --check
          git commit -m 'Fix Phase 8.2 strict TypeScript boundaries'
          git push origin HEAD:phase8-2-automation-engine
