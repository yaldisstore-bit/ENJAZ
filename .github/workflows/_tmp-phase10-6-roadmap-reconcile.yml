name: TEMP Phase 10.6 Roadmap Reconcile

on:
  push:
    branches:
      - phase10-6-formal-closure
    paths:
      - .github/workflows/_tmp-phase10-6-roadmap-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile-roadmap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: phase10-6-formal-closure
          fetch-depth: 0

      - name: Reconcile governing roadmap through Phase 10.6 closure
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/ENJAZ_MASTER_ROADMAP.md')
          text = path.read_text(encoding='utf-8')

          replacements = [
            (
              '- **Phase 10.1 — Document Vault is the sole authorized successor.**',
              '- **Phases 10.1–10.6 are formally CLOSED and certified; Phase 11.1 — Notifications & Follow-ups is the sole authorized successor.**',
              1,
            ),
            (
              '- **Phase 10.1 — Document Vault is AUTHORIZED NEXT; Phase 10.2+ remains locked until its predecessor closes.**',
              '- Historical transition note: Phase 10.1 was authorized at Phase 9.7 closure; Phases 10.1–10.6 have since CLOSED with governed evidence. **Phase 11.1 — Notifications & Follow-ups is now AUTHORIZED NEXT.**',
              1,
            ),
            (
              '## 10.1 — Document Vault',
              '## 10.1 — Document Vault ✅ CLOSED',
              1,
            ),
            (
              '## 10.2 — Document Intelligence / OCR',
              '## 10.2 — Document Intelligence / OCR ✅ CLOSED',
              1,
            ),
            (
              '## 10.3 — Document Factory & Official Form Engine — M7',
              '## 10.3 — Document Factory & Official Form Engine — M7 ✅ CLOSED',
              1,
            ),
            (
              '## 10.4 — Reports & PDF',
              '## 10.4 — Reports & PDF ✅ CLOSED',
              1,
            ),
            (
              '## 10.5 — Engagement/Contract Document Layer — M16',
              '## 10.5 — Engagement/Contract Document Layer — M16 ✅ CLOSED',
              1,
            ),
            (
              '## 10.6 — Documents Zero-Escape Gate',
              '## 10.6 — Documents Zero-Escape Gate ✅ CLOSED',
              1,
            ),
            (
              '- M7 and document portion of M16 require deployed-live evidence.',
              '- M7 and the Phase-10 document portion of M16 received deployed-live evidence. Phase 10.6 closed with destructive Real Cloud, exact-main, Real Browser, Pages and Live External certification; formal evidence: `docs/PHASE10_6_CLOSURE.md`.',
              1,
            ),
            (
              '- **Phase 10.1 — Document Vault: AUTHORIZED NEXT.**\n- Phase 10.2+ remains locked until predecessor closure.',
              '- **Phase 10.1 — Document Vault ✅ CLOSED.**\n- **Phase 10.2 — Document Intelligence / OCR ✅ CLOSED.**\n- **Phase 10.3 — Document Factory & Official Form Engine — M7 ✅ CLOSED.**\n- **Phase 10.4 — Reports & PDF ✅ CLOSED.**\n- **Phase 10.5 — Engagement/Contract Document Layer — M16 ✅ CLOSED.**\n- **Phase 10.6 — Documents Zero-Escape Gate ✅ CLOSED + destructive Real Cloud + exact-main + Real Browser + Pages + Live External certified.**\n- **Phase 11.1 — Notifications & Follow-ups: AUTHORIZED NEXT.**',
              1,
            ),
            (
              'The current reconciliation preserves all historical closure authority while authorizing only Phase 10.1:',
              'The current reconciliation preserves all historical closure authority while authorizing only Phase 11.1 after the complete Phase 10 document sequence closed:',
              1,
            ),
            (
              '13. current state documents, README, this roadmap and machine-readable system registry agree on Phase 9.7 closure;\n14. **Phase 10.1 — Document Vault is the sole authorized successor**;\n15. **Phase 10.2+ remains locked** until each predecessor closes under its own required evidence.',
              '13. current state documents, README, this roadmap and machine-readable system registry agree that Phases 10.1–10.6 are closed and certified;\n14. **Phase 11.1 — Notifications & Follow-ups is the sole authorized successor**;\n15. **Phase 11.2+ remains locked** until each predecessor closes under its own required evidence.',
              1,
            ),
            (
              'or authorize work beyond Phase 10.1.',
              'or authorize work beyond Phase 11.1.',
              1,
            ),
          ]

          for old, new, expected in replacements:
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'Expected {expected} occurrence(s) of {old!r}, found {count}')
              text = text.replace(old, new, expected)

          marker = '# Current position — canonical reconciled state'
          if marker not in text:
              raise SystemExit('Canonical current-position marker missing')
          if 'Phase 11.1 — Notifications & Follow-ups: AUTHORIZED NEXT' not in text:
              raise SystemExit('Phase 11.1 successor marker missing after reconciliation')
          if '## 10.6 — Documents Zero-Escape Gate ✅ CLOSED' not in text:
              raise SystemExit('Phase 10.6 closed marker missing after reconciliation')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit reconciled roadmap
        shell: bash
        run: |
          if git diff --quiet -- docs/ENJAZ_MASTER_ROADMAP.md; then
            echo 'No roadmap diff produced' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ENJAZ_MASTER_ROADMAP.md
          git commit -m 'docs: reconcile master roadmap through Phase 10.6 closure'
          git push origin HEAD:phase10-6-formal-closure
