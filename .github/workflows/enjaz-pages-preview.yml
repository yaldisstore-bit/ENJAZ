name: ENJAZ Pages Preview

# GitHub Pages keeps the frozen Legacy-Zero review surface at the root while also
# publishing the real Supabase-backed ENJAZ runtime under /live/. The live client
# uses only the public Supabase publishable key; no service-role/secret key exists
# in this browser build.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/enjaz-pages-preview.yml
  workflow_run:
    workflows: ["ENJAZ Quality Gate"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: enjaz-pages
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_APP_ENV: production
      VITE_APP_LOG_LEVEL: info
      VITE_SUPABASE_URL: https://juzxriirhkuzviwnhkbd.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_QL0eBUXHR6cSAVbINSkyWA_pIGyQ1oJ
    steps:
      - name: Checkout canonical main source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Require real Supabase runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${VITE_SUPABASE_URL:-}" || -z "${VITE_SUPABASE_PUBLISHABLE_KEY:-}" ]]; then
            echo "Real ENJAZ publish requires Supabase public runtime configuration."
            exit 1
          fi
          if [[ ! "$VITE_SUPABASE_URL" =~ ^https://[^/]+\.supabase\.co/?$ ]]; then
            echo "VITE_SUPABASE_URL must be an HTTPS hosted Supabase project URL."
            exit 1
          fi
          if [[ "$VITE_SUPABASE_PUBLISHABLE_KEY" != sb_publishable_* ]]; then
            echo "VITE_SUPABASE_PUBLISHABLE_KEY must use the modern sb_publishable_ format."
            exit 1
          fi
      - name: Build canonical production bridge for verification
        run: npm run build -- --base=/
      - name: Enforce canonical production budget
        run: node scripts/dist-budget-audit.mjs
      - name: Build real ENJAZ runtime for Pages /live
        run: npm run build -- --base="${{ steps.pages.outputs.base_path }}/live/" --outDir=dist-live
      - name: Enforce real Pages runtime governed JavaScript budgets
        env:
          ENJAZ_DIST_DIR: dist-live
        run: node scripts/dist-budget-audit.mjs
      - name: Build isolated R2 Legacy-Zero preview
        run: npx vite build --config vite.r2-preview.config.ts --base="${{ steps.pages.outputs.base_path }}/"
      - name: Enforce isolated R2 preview budget
        run: node scripts/ui-rebirth-2-preview-budget-audit.mjs
      - name: Compose review root and real live runtime
        run: |
          rm -rf dist
          mkdir -p dist/live
          cp -R dist-r2-preview/. dist/
          cp dist/r2-preview.html dist/index.html
          cp dist/index.html dist/404.html
          cp -R dist-live/. dist/live/
          cp dist/live/index.html dist/live/404.html
          node scripts/pages-live-fallback.mjs dist/404.html dist/live/index.html "${{ steps.pages.outputs.base_path }}/live/"
      - name: Verify Pages live deep-link fallback composition
        run: |
          node --test tests/pages-live-fallback.test.mjs
          grep -q 'data-enjaz-live-fallback="v1"' dist/404.html
          grep -q '/live/' dist/404.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Serialize after legacy branch Pages publisher
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Checking for a legacy branch-source Pages run for $TARGET_SHA"

          missing_attempts=0
          for i in {1..36}; do
            payload=$(curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPOSITORY/actions/runs?head_sha=$TARGET_SHA&per_page=100")

            state=$(printf '%s' "$payload" | node -e '
              let input = "";
              process.stdin.on("data", chunk => input += chunk);
              process.stdin.on("end", () => {
                const data = JSON.parse(input);
                const run = (data.workflow_runs || []).find(item =>
                  item.name === "pages build and deployment" ||
                  item.path === "dynamic/pages/pages-build-deployment"
                );
                if (!run) return process.stdout.write("missing");
                process.stdout.write(`${run.status}:${run.conclusion || ""}`);
              });
            ')

            echo "Legacy Pages publisher probe $i: $state"
            case "$state" in
              completed:success)
                echo "Legacy branch-source Pages publisher is finished; verified deploy may proceed last."
                exit 0
                ;;
              completed:*)
                echo "Legacy branch-source Pages publisher completed unsuccessfully: $state"
                exit 1
                ;;
              missing)
                missing_attempts=$((missing_attempts + 1))
                if [ "$missing_attempts" -ge 6 ]; then
                  echo "No legacy branch-source Pages publisher exists for this commit; proceeding with workflow-only deployment."
                  exit 0
                fi
                ;;
            esac

            sleep 5
          done

          echo "Legacy branch-source Pages publisher did not settle before the deploy guard expired."
          exit 1
      - name: Deploy verified review + real ENJAZ runtime to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
