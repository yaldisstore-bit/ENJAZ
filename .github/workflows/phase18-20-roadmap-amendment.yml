name: ENJAZ Phase 18-20 Roadmap Amendment Gate

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  phase18-20-roadmap-amendment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit governing amendment
        run: node scripts/phase18-20-roadmap-amendment-audit.mjs
