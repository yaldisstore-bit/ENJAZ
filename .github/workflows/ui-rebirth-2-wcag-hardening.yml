name: ENJAZ R2.0-10 — WCAG Hardening Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enjaz-r2-wcag-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wcag-hardening:
    name: R2 Preview / Real Chromium / WCAG A-AA
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Preserve R2 stage and palette contracts
        run: |
          npm run audit:qa:stage-contract
          node scripts/ui-rebirth-2-palette-audit.mjs
          node scripts/ui-rebirth-2-legacy-eradication-audit.mjs
      - name: Build isolated R2 preview
        run: npx vite build --config vite.r2-preview.config.ts --base=/
      - name: Enforce R2 preview budget
        run: node scripts/ui-rebirth-2-preview-budget-audit.mjs
      - name: Install pinned browser and WCAG tooling
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium
      - name: Start isolated R2 preview
        run: |
          nohup npx vite preview --config vite.r2-preview.config.ts --host 127.0.0.1 --port 4178 > /tmp/enjaz-r2-wcag.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4178/r2-preview.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/enjaz-r2-wcag.log
          exit 1
      - name: Attack R2 surfaces with Axe
        env:
          R2_WCAG_BASE_URL: http://127.0.0.1:4178/
        run: npx playwright test tests-external/r2-wcag-hardening.spec.cjs --reporter=line --workers=1
      - name: Upload WCAG diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: enjaz-r2-wcag-diagnostics-${{ github.sha }}
          path: |
            test-results/
            /tmp/enjaz-r2-wcag.log
          if-no-files-found: ignore
          retention-days: 7
