name: ENJAZ Phase 9.3 — Corporate Governance & Ownership Gate

on:
  push:
    branches:
      - main
      - 'phase9-3-*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enjaz-phase93-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase9-3-governance-ownership:
    name: Exact ownership / effective history / successor lock
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - name: Preserve Phase 9.2 closure and enforce Phase 9.3 contract
        run: |
          node scripts/phase9-2-search-saved-views-audit.mjs
          node scripts/phase9-3-governance-ownership-audit.mjs
          node scripts/phase9-3-bundle-headroom-audit.mjs
      - name: Governance foundation and persistence destruction tests
        run: |
          node --experimental-strip-types --test tests/phase9-3-governance-ownership-foundation.test.ts
          node --experimental-strip-types --test tests/phase9-3-corporate-ownership-persistence.test.ts
          node --experimental-strip-types --test tests/phase9-3-full-governance-persistence.test.ts
          node --experimental-strip-types --test tests/phase9-3-capital-authority-hardening.test.ts
      - name: Full functional regression
        run: npm run test:functional
      - name: Database and roadmap integrity
        run: npm run db:audit && npm run db:audit:selftest && npm run audit:roadmap
      - name: Major systems Zero-Escape governance
        run: node scripts/major-systems-zero-escape-audit.mjs
      - name: Secrets and TypeScript
        run: npm run audit:secrets && npm run typecheck
      - name: Production build and governed startup/lazy budgets
        run: npm run build -- --base=/ && npm run audit:dist:budget
      - name: Real Pages /live build and governed startup/lazy budgets
        run: npm run build -- --base=/ENJAZ/live/ && npm run audit:dist:budget
      - name: Assert authority, passed headroom gate and lifecycle-correct successor
        run: >-
          node -e "const j=JSON.parse(require('fs').readFileSync('docs/PHASE9_3_STATE.json','utf8'));
          const a=j.authority||{},b=j.budgetHeadroomGate||{},r=j.runtime||{};
          const authority=a.persistence==='DATABASE_RLS_REQUIRED'&&a.governanceWriteAuthority==='AUTHORIZED_GOVERNANCE_COMMANDS_ONLY'&&a.companyCoreAuthority==='REFERENCE_EXISTING_COMPANY_CORE_ONLY'&&a.partyReferenceAuthority==='EXISTING_COMPANY_OR_PERSON_RECORDS_ONLY'&&a.directBrowserSensitiveDmlAllowed===false&&a.shadowCompanyStoreAllowed===false&&a.shadowPartyStoreAllowed===false&&a.destructiveHistoryOverwriteAllowed===false&&a.crossWorkspaceAccessAllowed===false;
          const budget=j.javascriptBudgetBytes===670000&&j.budgetIncreaseAllowed===false&&j.baselinePagesLiveJavaScriptBytes===669998&&b.baselinePagesHeadroomBytes===2&&b.status==='PASS'&&b.runtimeExpansionAllowed===true&&b.pagesInitialJavaScriptBytes===555263&&b.pagesStartupHeadroomBytes===114737&&b.totalJavaScriptGuardBytes===760000&&b.lazyChunkGuardBytes===140000&&['AUTHORIZED_FOR_M2_IMPLEMENTATION','IN_PROGRESS','CERTIFIED'].includes(r.status);
          const lifecycle=j.status==='IN_PROGRESS'?(j.phase9_4Allowed===false&&j.exitGatePassed===false&&j.successorStatus==='LOCKED'):(j.status==='CLOSED'&&j.phase9_4Allowed===true&&j.exitGatePassed===true&&j.nextPhase==='9.4'&&j.successorStatus==='AUTHORIZED');
          if(!authority||!budget||!lifecycle)process.exit(1)"
