name: ENJAZ R2.0-5 — One-shot Closure Commit

on:
  push:
    branches:
      - r2-0-5-core-work-migration
    paths:
      - '.github/workflows/r2-0-5-close-once.yml'

permissions:
  contents: write

jobs:
  close-stage:
    name: Persist R2.0-5 closure records
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: r2-0-5-core-work-migration
          fetch-depth: 0

      - name: Persist parity, evidence, state and closure record
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const parityPath = 'docs/UI_UX_REBIRTH_2_0_FEATURE_PARITY.json';
          const statePath = 'docs/UI_UX_REBIRTH_2_0_STATE.json';
          const evidencePath = 'docs/UI_UX_REBIRTH_2_0_CORE_WORK_EVIDENCE.json';
          const closurePath = 'docs/R2_0_5_CORE_WORK_MIGRATION_CLOSURE.md';

          const targetCapabilities = new Set([
            'today.universal_inbox',
            'today.followup_actions',
            'transactions.list_search',
            'transactions.list_controls',
            'transactions.create',
            'transactions.edit',
            'transactions.editor_relationships',
            'transactions.editor_history',
            'transactions.360',
            'transactions.360_history',
            'transactions.360_related_work',
            'transactions.360_finance',
            'transactions.lifecycle.archive',
            'transactions.lifecycle.restore',
            'transactions.lifecycle.reactivate',
            'global.create.transaction',
          ]);

          const parity = JSON.parse(fs.readFileSync(parityPath, 'utf8'));
          const ids = new Set(parity.capabilities.map((item) => item.id));
          const missing = [...targetCapabilities].filter((id) => !ids.has(id));
          if (missing.length) throw new Error(`R2.0-5 parity targets missing: ${missing.join(', ')}`);

          parity.capabilities = parity.capabilities.map((item) => targetCapabilities.has(item.id)
            ? { ...item, migrated: true, tested: true }
            : item);
          const migratedCount = parity.capabilities.filter((item) => item.migrated === true).length;
          const testedCount = parity.capabilities.filter((item) => item.tested === true).length;
          if (migratedCount !== 16 || testedCount !== 16) {
            throw new Error(`R2.0-5 closure expected 16 migrated/tested capabilities, got ${migratedCount}/${testedCount}`);
          }
          fs.writeFileSync(parityPath, `${JSON.stringify(parity, null, 2)}\n`);

          const evidence = JSON.parse(fs.readFileSync(evidencePath, 'utf8'));
          evidence.status = 'CLOSED';
          evidence.connectedAdapter = 'src/ui-r2/core-work/CoreWorkConnected.tsx';
          evidence.checks = {
            structuralAudit: 'PASS',
            functionalRegression: 'PASS_118_OF_118',
            typescript: 'PASS',
            previewBuild: 'PASS',
            previewBudget: 'PASS',
            goldenRegression: 'PASS',
            realBrowserCoreWidths: 'PASS_11_OF_11',
          };
          evidence.gateRuns = {
            governance: 33968400308,
            quality: 33968400316,
            goldenRegression: 33968400344,
            coreWork: 33968400314,
            realBrowser: 33968400329,
          };
          evidence.artifact = {
            id: 9970170589,
            name: 'enjaz-r2-core-work-evidence-c8807e986f097e2be85b7373ca2f2a05239bc034',
            sourceCommit: '652b1ae00e230de200da75564cf4b05d403c2ea1',
            sha256: 'b48bee30e7c0b7068a70b41a037c7cd9065edae1297ecb70136385eea8ef97e9',
          };
          evidence.exitGatePassed = true;
          fs.writeFileSync(evidencePath, `${JSON.stringify(evidence, null, 2)}\n`);

          const state = JSON.parse(fs.readFileSync(statePath, 'utf8'));
          if (state.stage !== 'R2.0-5') throw new Error(`Unexpected current stage: ${state.stage}`);
          if (state.phase55Locked !== true) throw new Error('Phase 5.5 lock was lost');
          if (state.runtime !== 'ui-v2') throw new Error('Canonical runtime moved before R2.0-11');
          state.coreWorkMigration = {
            ...state.coreWorkMigration,
            status: 'CLOSED',
            evidenceManifest: evidencePath,
            closureRecord: closurePath,
            evidenceRun: 33968400314,
            canonicalRuntimeChanged: false,
            exitGatePassed: true,
          };
          state.featureParity = {
            ...state.featureParity,
            migratedCapabilities: migratedCount,
            testedCapabilities: testedCount,
            unresolvedCapabilities: 0,
          };
          fs.writeFileSync(statePath, `${JSON.stringify(state, null, 2)}\n`);

          const closure = `# ENJAZ Rebirth 2.0 — R2.0-5 Core Work Migration Closure\n\nStatus: **CLOSED**\n\nR2.0-5 is closed after the approved Golden Experience and after migrating the authoritative core-work presentation into the isolated Rebirth 2.0 layer without changing canonical runtime ownership.\n\n## Delivered\n\n- Transactions list/search/views/sorting/pagination in R2 presentation.\n- Transaction create/edit presentation wired to the existing authoritative editor service.\n- Transaction 360° presentation with bounded history, related work, linked documents and financial context.\n- Archive, restore and reactivation kept as distinct lifecycle actions through the authoritative lifecycle service.\n- Today / Universal Inbox with authoritative follow-up completion and snooze behavior.\n- Follow-up destination backed by the Daily Work source without promoting general notifications early.\n- Global transaction create entry delegated to the authoritative transaction editor.\n- Live connected adapters use existing feature hooks/services; preview fixtures remain isolated and cannot claim production writes.\n- The R2.0-4 Golden visual identity and the user-locked polish contract remain frozen across the migrated core work.\n\n## Parity accounting\n\nR2.0-5 closes exactly **16 / 35** inventoried capabilities as migrated and tested. Capabilities assigned to later stages remain false and are not overclaimed.\n\n## Gate evidence\n\n- Governance Gate: PASS — run 33968400308.\n- Quality Gate: PASS — run 33968400316.\n- Golden regression: PASS — run 33968400344.\n- R2.0-5 Core Work Gate: PASS — run 33968400314.\n- Real Browser Acceptance: PASS — run 33968400329.\n- Functional regression: **118 / 118 PASS**.\n- R2.0-5 browser suite: **11 / 11 PASS**.\n- Hard browser widths: **1280 / 430 / 390 / 360 / 320**.\n- Evidence artifact: 9970170589, SHA-256 b48bee30e7c0b7068a70b41a037c7cd9065edae1297ecb70136385eea8ef97e9.\n\n## Frozen boundaries\n\nR2.0-5 does **not**:\n- promote UiR2Root to the canonical runtime,\n- unlock or start Phase 5.5,\n- claim the full Documents/Reports domain,\n- claim authoritative general notifications,\n- migrate Companies or People/Lawyers,\n- migrate Finance, Operations, Workflow, Automation, Command Center, Risk/Insights or Copilot,\n- delete legacy presentation generations.\n\nCanonical runtime remains **ui-v2** until R2.0-11. Phase 5.5 remains locked.\n\nThe next allowed Rebirth stage is **R2.0-6 — Records & Relationships**. It must be started explicitly and is not started by this closure.\n`;
          fs.writeFileSync(closurePath, closure);
          NODE

      - name: Commit closure
        shell: bash
        run: |
          git config user.name 'ENJAZ Governance Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/UI_UX_REBIRTH_2_0_FEATURE_PARITY.json \
                  docs/UI_UX_REBIRTH_2_0_STATE.json \
                  docs/UI_UX_REBIRTH_2_0_CORE_WORK_EVIDENCE.json \
                  docs/R2_0_5_CORE_WORK_MIGRATION_CLOSURE.md
          git diff --cached --check
          git commit -m 'Close R2.0-5 — core work migration'
          git push origin HEAD:r2-0-5-core-work-migration
