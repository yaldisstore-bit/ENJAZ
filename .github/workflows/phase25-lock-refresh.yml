name: ENJAZ Phase 2.5 Lock Refresh

on:
  push:
    branches: [phase-2.5-motion-interaction]

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.event.head_commit.message == 'phase25-lock-refresh'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: phase-2.5-motion-interaction
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Refresh lock metadata without dependency drift
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Assert package and lock versions match
        run: node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if(l.version!==p.version || l.packages[''].version!==p.version) process.exit(1)"
      - name: Commit lock metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ENJAZ CI'
          git config user.email 'actions@users.noreply.github.com'
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m 'chore: sync Phase 2.5 package lock metadata'
          git push origin HEAD:phase-2.5-motion-interaction
