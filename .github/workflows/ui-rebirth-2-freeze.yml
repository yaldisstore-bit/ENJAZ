name: ENJAZ UI/UX Rebirth 2.0 — Governance Gates

on:
  push:
    branches:
      - main
      - 'ui-rebirth-2-*'
      - 'ui-ux-rebirth-2-*'
      - 'r2-0-*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance-contracts:
    name: Rebirth 2.0 / Freeze + Palette + Acceptance + IA + Design System + Shell + Golden Polish
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Enforce Phase 5.5 freeze
        run: node scripts/ui-rebirth-2-freeze-audit.mjs
      - name: Enforce locked five-color palette
        run: node scripts/ui-rebirth-2-palette-audit.mjs
      - name: Enforce Beauty + No-Maze + parity + Legacy-Zero contracts
        run: node scripts/ui-rebirth-2-acceptance-audit.mjs
      - name: Enforce R2.0-1 information architecture
        run: node scripts/ui-rebirth-2-ia-audit.mjs
      - name: Enforce R2.0-2 Design System
        run: node scripts/ui-rebirth-2-design-system-audit.mjs
      - name: Preserve frozen R2.0-3 Application Shell
        run: node scripts/ui-rebirth-2-shell-audit.mjs
      - name: Enforce user-locked global visual polish rules from R2.0-4
        run: node scripts/ui-rebirth-2-golden-visual-contract-audit.mjs
