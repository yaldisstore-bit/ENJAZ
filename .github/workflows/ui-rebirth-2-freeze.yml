name: ENJAZ UI/UX Rebirth 2.0 — Governance Gates

on:
  push:
    branches:
      - main
      - 'ui-rebirth-2-*'
      - 'ui-ux-rebirth-2-*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance-contracts:
    name: Rebirth 2.0 / Freeze + Palette + Hard Acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Enforce Phase 5.5 freeze
        run: node scripts/ui-rebirth-2-freeze-audit.mjs
      - name: Enforce locked five-color palette
        run: node scripts/ui-rebirth-2-palette-audit.mjs
      - name: Enforce Beauty + No-Maze + parity + Legacy-Zero contracts
        run: node scripts/ui-rebirth-2-acceptance-audit.mjs
