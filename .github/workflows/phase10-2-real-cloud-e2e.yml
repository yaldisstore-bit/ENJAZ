name: ENJAZ Phase 10.2 — Real Cloud Document Intelligence E2E

on:
  push:
    branches:
      - 'phase10-2-*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase10-2-real-cloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-cloud-document-intelligence:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SUPABASE_URL: https://juzxriirhkuzviwnhkbd.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_QL0eBUXHR6cSAVbINSkyWA_pIGyQ1oJ
      SUPABASE_SECRET_KEY: ${{ secrets.ENJAZ_SUPABASE_SECRET_KEY }}
      ENJAZ_REAL_CLOUD_CONFIRM: YES
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Require privileged server-only test credential
        shell: bash
        run: |
          test -n "$SUPABASE_SECRET_KEY" || { echo 'ENJAZ_SUPABASE_SECRET_KEY is missing'; exit 1; }
          case "$SUPABASE_SECRET_KEY" in sb_publishable_*) echo 'Secret is not privileged'; exit 1;; esac
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Preserve Phase 10.2 authority before cloud mutation
        run: |
          node scripts/phase10-2-document-intelligence-audit.mjs
          node --experimental-strip-types --test tests/documentIntelligence.test.ts
          node --experimental-strip-types --test tests/documentVault.test.ts
      - name: Authenticated Real Cloud OCR lifecycle / stale-source / zero-residue certificate
        run: node scripts/phase10-2-real-cloud-e2e.mjs
      - name: Upload Real Cloud evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase10-2-real-cloud-${{ github.sha }}
          path: artifacts/phase10-2-real-cloud/evidence.json
          if-no-files-found: error
          retention-days: 30
