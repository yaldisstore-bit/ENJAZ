name: ENJAZ Phase 10.1 — Overlay Layout Repair

on:
  push:
    branches: [phase10-1-document-vault]
    paths: ['.github/workflows/phase10-1-overlay-layout-repair.yml']

permissions:
  contents: write

jobs:
  repair-overlay-listener:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: phase10-1-document-vault
          fetch-depth: 0
      - name: Replace passive Escape binding with pre-paint binding
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for name in ['src/ui-r2/runtime/UiR2PreviewRoot.tsx','src/ui-r2/runtime/UiR2Root.tsx']:
            p=Path(name); s=p.read_text()
            replacements=[
              ("import { useEffect, useMemo, useRef, useState, type ReactNode } from 'react';", "import { useEffect, useLayoutEffect, useMemo, useRef, useState, type ReactNode } from 'react';"),
              ("  const ownedOverlay = useRef(false);\n  const pendingHistoryClose = useRef(false);\n  const queuedOverlay = useRef<Exclude<OverlayId, null> | null>(null);\n  useR2OverlayFocusGuard(overlay);", "  const ownedOverlay = useRef(false);\n  useR2OverlayFocusGuard(overlay);"),
              ("    const syncFromHistory = () => {\n      const next = readUrlState();\n      setDestinationId(next.destinationId);\n      setTransactionId(next.transactionId);\n      const queued = queuedOverlay.current;\n      pendingHistoryClose.current = false;\n      queuedOverlay.current = null;\n      if (queued) { writeUrlState(next.destinationId, queued, next.transactionId); setOverlay(queued); ownedOverlay.current = true; }\n      else { setOverlay(next.overlay); ownedOverlay.current = false; }\n    };", "    const syncFromHistory = () => { const next = readUrlState(); setDestinationId(next.destinationId); setTransactionId(next.transactionId); setOverlay(next.overlay); ownedOverlay.current = false; };"),
              ("    if (ownedOverlay.current) { ownedOverlay.current = false; pendingHistoryClose.current = true; setOverlay(null); window.history.back(); }", "    if (ownedOverlay.current) { ownedOverlay.current = false; setOverlay(null); window.history.back(); }"),
              ("  useEffect(() => {\n    const onKey = (event: KeyboardEvent) => { if (event.key === 'Escape' && overlay) { event.preventDefault(); closeOverlay(); } };", "  useLayoutEffect(() => {\n    const onKey = (event: KeyboardEvent) => { if (event.key === 'Escape' && overlay) { event.preventDefault(); closeOverlay(); } };"),
              ("  const openOverlay = (id: Exclude<OverlayId, null>) => {\n    if (pendingHistoryClose.current) { queuedOverlay.current = id; return; }\n    writeUrlState(destinationId, id, transactionId);\n    setOverlay(id);\n    ownedOverlay.current = true;\n  };", "  const openOverlay = (id: Exclude<OverlayId, null>) => { writeUrlState(destinationId, id, transactionId); setOverlay(id); ownedOverlay.current = true; };")
            ]
            for old,new in replacements:
              c=s.count(old)
              if c!=1: raise SystemExit(f'{name}: expected one seam, found {c}: {old[:60]}')
              s=s.replace(old,new,1)
            p.write_text(s)

          p=Path('src/ui-r2/runtime/UiR2LiveRoot.tsx'); s=p.read_text()
          replacements=[
            ("import { useEffect, useRef, useState, type ReactNode } from 'react';", "import { useEffect, useLayoutEffect, useRef, useState, type ReactNode } from 'react';"),
            ("ownedOverlay=useRef(false),pendingHistoryClose=useRef(false),queuedOverlay=useRef<Exclude<OverlayId,null>|null>(null);useR2OverlayFocusGuard(overlay);", "ownedOverlay=useRef(false);useR2OverlayFocusGuard(overlay);"),
            ("useEffect(()=>{const sync=()=>{const n=readUrlState(),queued=queuedOverlay.current;setDestinationId(n.destinationId);setTransactionId(n.transactionId);pendingHistoryClose.current=false;queuedOverlay.current=null;if(queued){writeUrlState(n.destinationId,queued,n.transactionId);setOverlay(queued);ownedOverlay.current=true}else{setOverlay(n.overlay);ownedOverlay.current=false}};window.addEventListener('popstate',sync);return()=>window.removeEventListener('popstate',sync)},[]);", "useEffect(()=>{const sync=()=>{const n=readUrlState();setDestinationId(n.destinationId);setTransactionId(n.transactionId);setOverlay(n.overlay);ownedOverlay.current=false};window.addEventListener('popstate',sync);return()=>window.removeEventListener('popstate',sync)},[]);"),
            ("if(ownedOverlay.current){ownedOverlay.current=false;pendingHistoryClose.current=true;setOverlay(null);window.history.back()}", "if(ownedOverlay.current){ownedOverlay.current=false;setOverlay(null);window.history.back()}"),
            ("useEffect(()=>{const onKey=(e:KeyboardEvent)=>{if(e.key==='Escape'&&overlay){e.preventDefault();closeOverlay()}};", "useLayoutEffect(()=>{const onKey=(e:KeyboardEvent)=>{if(e.key==='Escape'&&overlay){e.preventDefault();closeOverlay()}};"),
            ("openOverlay=(id:Exclude<OverlayId,null>)=>{if(pendingHistoryClose.current){queuedOverlay.current=id;return}writeUrlState(destinationId,id,transactionId);setOverlay(id);ownedOverlay.current=true};", "openOverlay=(id:Exclude<OverlayId,null>)=>{writeUrlState(destinationId,id,transactionId);setOverlay(id);ownedOverlay.current=true};")
          ]
          for old,new in replacements:
            c=s.count(old)
            if c!=1: raise SystemExit(f'UiR2LiveRoot.tsx: expected one seam, found {c}: {old[:60]}')
            s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Verify and commit
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          git diff --check
          git config user.name 'enjaz-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add src/ui-r2/runtime/UiR2LiveRoot.tsx src/ui-r2/runtime/UiR2PreviewRoot.tsx src/ui-r2/runtime/UiR2Root.tsx
          git commit -m 'Phase 10.1 — bind Escape before overlay becomes interactive'
          git push origin HEAD:phase10-1-document-vault
