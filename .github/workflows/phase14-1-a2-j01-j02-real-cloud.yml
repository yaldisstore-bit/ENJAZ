name: ENJAZ Phase 14.1 A2 — J01/J02 Real Cloud (NOT full A2)

on:
  push:
    branches:
      - 'phase14-1-*'
    paths:
      - 'scripts/phase14-1-a2-company-transaction-real-cloud.mjs'
      - '.github/workflows/phase14-1-a2-j01-j02-real-cloud.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enjaz-phase141-a2-auth-smoke
  cancel-in-progress: false

jobs:
  isolated-company-transaction:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: phase13-4-isolated-real-cloud
    env:
      PRODUCTION_PROJECT_REF: juzxriirhkuzviwnhkbd
      ENJAZ_A2_BRANCH_REF: nqhgaukutkyvfumbtbtg
      ENJAZ_REAL_CLOUD_CONFIRM: YES
      ENJAZ_A2_ISOLATED_BRANCH_CONFIRM: YES
      SUPABASE_URL: ${{ secrets.PHASE13_4_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PHASE13_4_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.PHASE13_4_SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Fail closed on missing or unsafe lab credentials
        run: node scripts/phase14-1-a2-isolated-auth-preflight.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Test real JWT J01/J02 create, reload, cross-workspace isolation and cleanup
        run: node scripts/phase14-1-a2-company-transaction-real-cloud.mjs
      - name: Require isolated, passing J01/J02 evidence and clean fixtures
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const e = JSON.parse(fs.readFileSync('artifacts/phase14-1-a2-company-transaction-real-cloud/evidence.json', 'utf8'));
          if (e.projectRef !== 'nqhgaukutkyvfumbtbtg' || e.productionProjectRef === e.projectRef ||
              e.passed !== true || e.cleanupPassed !== true ||
              e.completeElevenDomainA2 !== false || e.phase14_1Closed !== false ||
              e.scope?.join(',') !== 'J01_COMPANY,J02_TRANSACTION') throw new Error('J01/J02 isolated evidence invalid');
          console.log('PASS J01/J02 real Auth source journey and isolated zero residue (NOT full A2)');
          NODE
      - name: Upload isolated J01/J02 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase141-a2-j01-j02-real-cloud
          path: |
            artifacts/phase14-1-a2-isolated-auth/preflight.json
            artifacts/phase14-1-a2-company-transaction-real-cloud/evidence.json
          if-no-files-found: error
          retention-days: 30
