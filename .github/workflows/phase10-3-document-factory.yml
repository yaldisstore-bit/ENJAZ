name: ENJAZ Phase 10.3 — Document Factory & Official Form Engine Gate

on:
  push:
    branches:
      - 'phase10-3-*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enjaz-phase103-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase10-3-governance:
    name: Template versions / provenance / fail-closed issuance / successor lock
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VITE_APP_ENV: production
      VITE_APP_LOG_LEVEL: info
      VITE_SUPABASE_URL: https://juzxriirhkuzviwnhkbd.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_QL0eBUXHR6cSAVbINSkyWA_pIGyQ1oJ
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Phase 10.3 authority audit
        run: node scripts/phase10-3-document-factory-audit.mjs
      - name: Document Factory destruction tests
        run: node --experimental-strip-types --test tests/documentFactory.test.ts
      - name: Preserve Document Intelligence destruction tests
        run: node --experimental-strip-types --test tests/documentIntelligence.test.ts
      - name: Preserve Document Vault destruction tests
        run: node --experimental-strip-types --test tests/documentVault.test.ts
      - name: Preserve full functional regression
        run: npm run test:functional
      - name: Preserve database, roadmap and major-system integrity
        run: npm run db:audit && npm run db:audit:selftest && npm run audit:roadmap && node scripts/major-systems-zero-escape-audit.mjs
      - name: Preserve secret boundary and TypeScript
        run: npm run audit:secrets && npm run typecheck
      - name: Preserve production build and frozen budgets
        run: npm run build -- --base=/ && npm run audit:dist:budget
      - name: Preserve Pages live build and frozen budgets
        run: npm run build -- --base=/ENJAZ/live/ && npm run audit:dist:budget
      - name: Enforce Phase 10.3 lifecycle governance
        run: node -e "const j=require('./docs/PHASE10_3_STATE.json');if(!(j.phase==='10.3'&&j.status==='IN_PROGRESS'&&j.baseCommit==='667f2cc3892d8167e5880f030a1ff6dd6baf47b9'&&j.majorSystem==='M7'&&j.majorSystemStatus==='ACTIVE'&&j.databaseAuthorityMigrationAdded===true&&j.authorityHardeningMigrationAdded===true&&j.domainContractAdded===true&&j.stageFoundationTestsAdded===true&&j.phaseGateAdded===true&&j.databaseAuthorityExtensionAdded===false&&j.directBrowserFinalizationAllowed===false&&j.unverifiedOcrAllowedInOfficialGeneration===false&&j.verifiedOcrMustBeCurrent===true&&j.generatedOutputMayMutateSourceRecords===false&&j.phase10_4Allowed===false&&j.nextPhase==='10.4'&&j.successorStatus==='LOCKED'&&j.budgetIncreaseAllowed===false))process.exit(1)"
