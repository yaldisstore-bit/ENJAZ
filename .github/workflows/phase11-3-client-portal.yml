name: ENJAZ Phase 11.3 — Client Portal M3 Gate

on:
  push:
    branches: [phase11-3-client-portal, phase11-3a-client-portal-authority]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enjaz-phase11-3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authority:
    name: External identity isolation / object grants / M4 lock
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Phase 11.3 authority and successor audit
        run: node scripts/phase11-3-client-portal-audit.mjs
      - name: Phase 11.3A executable authority destruction tests
        run: node --experimental-strip-types --test tests/clientPortalAuthority.test.ts
      - name: Roadmap lifecycle audit
        run: npm run audit:roadmap
      - name: Preserve database integrity before M3 schema extension
        run: npm run db:audit && npm run db:audit:selftest
      - name: Secrets boundary
        run: npm run audit:secrets
      - name: TypeScript integration baseline
        run: npm run typecheck
      - name: Production build and frozen budgets
        run: npm run build && npm run audit:dist:budget
      - name: Dependency high-severity audit
        run: npm audit --audit-level=high
