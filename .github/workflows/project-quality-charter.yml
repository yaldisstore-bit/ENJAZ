name: ENJAZ Project Quality Constitution Gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-quality-constitution:
    name: Product + UI/UX + Engineering + Certification
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Enforce non-negotiable ENJAZ quality constitution
        run: node scripts/project-quality-charter-audit.mjs
