name: ENJAZ Phase 12.4 — Regulatory Knowledge Assistance A2 Real Cloud
# certification-replay: edge-v2

on:
  push:
    branches:
      - phase12-4-regulatory-knowledge-assistance
    paths:
      - 'scripts/phase12-4-a2-real-cloud-e2e.mjs'
      - '.github/workflows/phase12-4-a2-real-cloud-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enjaz-phase124-a2-real-cloud
  cancel-in-progress: false

jobs:
  real-cloud:
    name: Auth / Empty-Store Fail-Closed / Workspace Isolation / Zero Mutation / Zero Residue
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SUPABASE_URL: https://juzxriirhkuzviwnhkbd.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_QL0eBUXHR6cSAVbINSkyWA_pIGyQ1oJ
      SUPABASE_SECRET_KEY: ${{ secrets.ENJAZ_SUPABASE_SECRET_KEY }}
      ENJAZ_REAL_CLOUD_CONFIRM: YES
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Require server-only setup credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_SECRET_KEY"
          case "$SUPABASE_SECRET_KEY" in sb_publishable_*) exit 1 ;; esac
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Static A2 Real Cloud guards
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/phase12-4-a2-real-cloud-e2e.mjs
          node --test tests/phase12-4-regulatory-assistance-edge-source.test.mjs
          if grep -Eq 'sb_secret_[A-Za-z0-9_-]+' scripts/phase12-4-a2-real-cloud-e2e.mjs; then exit 1; fi
      - name: Run fresh authenticated A2 empty-store safety evidence
        run: node scripts/phase12-4-a2-real-cloud-e2e.mjs
      - name: Upload sanitized A2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase12-4-a2-real-cloud-${{ github.sha }}
          path: artifacts/phase12-4-a2-real-cloud/evidence.json
          if-no-files-found: error
          retention-days: 14
