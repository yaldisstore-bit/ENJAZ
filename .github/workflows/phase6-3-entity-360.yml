name: ENJAZ Phase 6.3 — Company / Lawyer 360° Gate

on:
  push:
    branches:
      - 'phase6-3-*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enjaz-phase63-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase6-3-entity-360:
    name: Unified 360 / Composition / Real Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Preserve canonical R2 and Legacy-Zero
        run: |
          node scripts/ui-rebirth-2-freeze-audit.mjs
          node scripts/ui-rebirth-2-legacy-eradication-audit.mjs
          node scripts/ui-rebirth-2-records-audit.mjs
      - name: Enforce Phase 6.3 composition contract
        run: node scripts/phase6-3-entity-360-audit.mjs
      - name: Phase 6.3 composition tests
        run: node --experimental-strip-types --test tests/entity360Service.test.ts
      - name: Full functional regression
        run: npm run test:functional
      - name: Secrets audit
        run: npm run audit:secrets
      - name: Database integrity
        run: npm run db:audit && npm run db:audit:selftest
      - name: Roadmap integrity
        run: npm run audit:roadmap
      - name: TypeScript
        run: npm run typecheck
      - name: Production candidate build
        run: npm run build -- --base=/
      - name: Preserve production asset budget
        run: npm run audit:dist:budget
      - name: Build isolated Phase 6.3 preview
        run: npx vite build --config vite.phase6-3-preview.config.ts --base=/
      - name: Enforce isolated preview size
        run: |
          test -f dist-phase6-3-preview/phase6-3-preview.html
          BYTES=$(du -sb dist-phase6-3-preview | cut -f1)
          echo "Phase 6.3 preview bytes: $BYTES"
          test "$BYTES" -le 8388608
      - name: Install pinned real-browser tooling
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0 playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start isolated Phase 6.3 preview
        run: |
          nohup npx vite preview --config vite.phase6-3-preview.config.ts --host 127.0.0.1 --port 4179 > /tmp/enjaz-phase63-preview.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4179/phase6-3-preview.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/enjaz-phase63-preview.log
          exit 1
      - name: Real Chromium Company / Lawyer 360 acceptance
        env:
          PHASE63_BASE_URL: http://127.0.0.1:4179/
          PHASE63_ARTIFACT_DIR: artifacts/phase6-3-entity-360
        run: npx playwright test tests-external/phase6-3-entity-360.spec.cjs --reporter=line --workers=1
      - name: Upload Phase 6.3 diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: enjaz-phase6-3-diagnostics-${{ github.sha }}
          path: |
            test-results/
            artifacts/phase6-3-entity-360/
            /tmp/enjaz-phase63-preview.log
          if-no-files-found: ignore
          retention-days: 7
