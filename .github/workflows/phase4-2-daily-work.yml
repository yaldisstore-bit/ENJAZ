name: ENJAZ Phase 4.2 — Daily Work Reality Gate

on:
  pull_request:
    branches: [uiux-rebirth-v2]
    paths:
      - 'src/features/daily-work/**'
      - 'src/data/createDataLayer.ts'
      - 'src/ui-v2/**'
      - 'src/main.tsx'
      - 'tests/dailyWork*.test.ts'
      - 'scripts/phase4-2-**'
      - 'package.json'
      - '.github/workflows/phase4-2-daily-work.yml'
      - 'docs/ENJAZ_MASTER_ROADMAP.md'
      - 'docs/PHASE4_2_**'

jobs:
  phase4-2-daily-work-reality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: Frozen UI V2 boundary audit
        run: npm run audit:ui-v2:boundary
      - name: Phase 4.2 architecture audit
        run: node scripts/phase4-2-daily-work-audit.mjs
      - name: Functional regression tests
        run: npm run test:functional
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Install Chromium test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start safe preview Vite runtime
        env:
          VITE_ENJAZ_PREVIEW_MODE: 'true'
        run: |
          VITE_ENJAZ_PREVIEW_MODE=true npm run dev -- --host 127.0.0.1 --port 4192 > /tmp/enjaz-phase42-vite.log 2>&1 &
          echo $! > /tmp/enjaz-phase42-vite.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4192 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/enjaz-phase42-vite.log
          exit 1
      - name: Phase 4.2 real browser journey
        env:
          PHASE42_BASE_URL: http://127.0.0.1:4192
          PHASE42_ARTIFACT_DIR: artifacts/phase4-2-daily-work
        run: node scripts/phase4-2-daily-work-reality.mjs
      - name: Upload Phase 4.2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-2-daily-work-evidence
          path: artifacts/phase4-2-daily-work
          if-no-files-found: warn
          retention-days: 30
